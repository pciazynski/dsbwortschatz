<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>

<body style="text-align:left;">
<script type="module">
	var dataset = getQueryVariable('data')
	var word = getQueryVariable('word')
	var year = getQueryVariable("year")
	dataset = dataset +"?word="+word+"&sort"
	var diagramtitle = lang_docreferences + ' ' +word
	if(year.length>0){diagramtitle+="<br>"+year;dataset+="&year="+year}
	var data_arr = (await readPHP_async(dataset)).trim("\n").split('\n');
	
	var str = '<head><link rel="stylesheet" href="../../digilabstyles.css"></head><table class="clicktable">'
	if(dataset.includes("urnbyword")){
		str += str + '<tr><th>'+lang_year+'</th><th>'+lang_tokensearch+'</th><th>'+lang_worddistribution+'</th><th>'+lang_ebook+'</th><th>'+lang_faksimilie+'<br>'+lang_digbibliothek+'</th><th>'+lang_document+'<br>'+lang_cts+'</th>'
	}
	str += '</tr>'
	for (var i = 0; i < data_arr.length; i++) {
		var arr = data_arr[i].split(sep)
		
		var urnarr = arr[0].split(":")[3].replaceAll("."," ").replaceAll("_"," ").split(" ")
		var tmpname = ""
		for (var j = 0; j < urnarr.length; j++){
			tmpname += " "+urnarr[j].charAt(0).toUpperCase() + urnarr[j].slice(1)
		}
		//Remove Versioning Timestamp
		tmpname = tmpname.substring(0,tmpname.lastIndexOf(" "))
		
		var onclickfun0 = "window.open('"+ctsurl.slice(0,-5)+"/plain/textsearch.php?urn="+arr[0]+"&snippet="+word+"', '_blank')"
		var onclickfun1 = "window.open('"+ctsurl.slice(0,-5)+"/fancy/ebook.php?urn="+arr[0]+"', '_blank')"
		var onclickfun2 = "window.open('"+ctsurl+"?request=GetPassage&urn="+arr[0]+"', '_blank')"
		var onclickfun3 = "window.open('"+ctsurl.slice(0,-5)+"/vis/textdistribution.html?urn="+arr[0]+"&snippet="+word+"&lowercase', '_blank')"
		var onclickfun4 = "window.open('"+ctsurl.slice(0,-5)+"/plain/textdistribution.php?urn="+arr[0]+"&snippet="+word+"&lowercase', '_blank')"
		var onclickfun5 = "window.open('https://dolnoserbski.de/biblioteka/pokaz/"+tmpname.toLowerCase().trim().replaceAll(" ","-")+"', '_blank')"
		var resstr='<span style="color:'+getColor(arr[0].replace(/[0-9]/g,""))+';">▮</span>'+tmpname
		if(dataset.includes("urnbyword")){
			str += '<tr><td>'+arr[1]+'</td><td> <span onclick="'+onclickfun0+'"> &#10008;</span> </td><td> <span onclick="'+onclickfun3+'"> &#10087;</span> | <span onclick="'+onclickfun4+'"> &#10138; </span></td><td onclick="'+onclickfun1+'"> &#x1F56E; </td><td onclick="'+onclickfun5+'"> &#128247; </td><td onclick="'+onclickfun2+'">'+resstr+'</td>'
		}
		else{
			str += '<tr><td>'+arr[1]+'</td><td onclick="'+onclickfun1+'"> &#x1F56E; </td><td onclick="'+onclickfun5+'"> &#128247; </td><td onclick="'+onclickfun2+'">'+resstr+'</td>'
		}
		str += '</tr>'
	}
	str += '</table>';
	document.write(str)
	data_arr = ""
	str = ""
	document.title = diagramtitle

</script>
</body>
