<script>
	yearminslider.oninput = function() {
		otherslider=document.getElementById("yearmaxslider")
		otherslider.value=Math.max(otherslider.value,this.value)
		yearminvalue.innerHTML = this.value
		yearmaxvalue.innerHTML = otherslider.value
	}

	yearmaxslider.oninput = function() {
		otherslider=document.getElementById("yearminslider")
		otherslider.value=Math.min(otherslider.value,this.value)
		yearminvalue.innerHTML = otherslider.value
		yearmaxvalue.innerHTML = this.value
	}
	yearminslider.min=minDate

	
	yearmaxslider.min = minDate
	yearmaxslider.max = maxDate
	yearminslider.min = minDate
	yearminslider.max = maxDate
	yearminslider.value = minDate
	yearmaxslider.value = maxDate
	yearminvalue.innerHTML=minDate
	yearmaxvalue.innerHTML = maxDate

</script>

<br><br>
<script>

	
	var zipfTypecount = function(){
		loading("zipf")
		document.getElementById("zipf").src="zipf.html?data=typecountperlemma.php&sort=1"
	}
	
	var updateYearlabel = function(){
		tmp = parseInt(document.getElementById("yearminslider").value)
		document.getElementById("yearlabel").innerHTML = tmp
	}
	
	var callDolnoserbski = function(){
		curlemma = document.getElementById("lemma").value.trim()
		if(curlemma.length>0){
			window.open("https://dolnoserbski.de/ortografija/slownik?wuraz="+curlemma, "_blank")
		}
	}
	
	var callLemmatree = function(){
		curlemma = document.getElementById("lemma").value.trim()
		if(curlemma.length>0){
			window.open("../lemmavariation?lemma="+curlemma, "_blank")
		}
	}
	
	var updateZipf = function(){
		loading("zipf")
		tmp = document.getElementById("min").value.trim()
		document.getElementById("zipf").src="zipf.html?data=lemmamapping/_lemmabag&min="+tmp
		document.getElementById('docref').src = 'error_docref.html'
		document.getElementById('traviz').src = 'error_docref.html'
	}
		
	updateZipf()
	document.title=lang_lemmafy+" "+lang_statistics

</script>
