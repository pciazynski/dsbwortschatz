<!DOCTYPE html>
<meta charset="utf-8">
<head>
  <!-- Plotly.js -->
  <script src="../../lib/plotly-latest.min.js"></script>
  <script src="../../_assets/datahandler.js"></script>
  <script src="../../lib/config.js"></script>
  <link rel="stylesheet" href="../../styles.css">

</head>

<body>

<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>

<script>



var dataset = getQueryVariable("data")
var max = getQueryVariable("max")
var min = getQueryVariable("min")
data_arr = readTextFile(dataset).split("\n");
allText=""
maxval = 0
minval = 10000000

date= []
count = []

diagramtitle = dataset
for (var i = 0; i < data_arr.length; i++) {
	line = data_arr[i];
	if(line.length>1)
	{	
		tmp = line.split("\t")
		value  = parseInt(tmp[1])
		if(max.length>0 & value > parseInt(max)){continue}
		if(min.length>0 & value < parseInt(min)){continue}
		date.push(tmp[0])
		count.push(value)
		if (value<minval ){minval = value}
		if (value>maxval ) {maxval = value}
	}
}

var data = [{
	x: date,
	y: count,
	type: 'bar',
	marker: {
		color: "black"
	}
}];

var layout = {
	barmode: 'stack',
	legend: {
		x: 0,
		y: 1.2,
		font: 	{
			family: diagramfont,
			size: diagramfontsize
			}
		
		},
	title:	{
		text:diagramtitle,
		font: 	{
			family: diagramfont,
			size: diagramfontsize
			}
		},
	xaxis: 	{
		automargin: true,
		linecolor: '#636363',
		linewidth: 6,
		title: {
      			font: {
			family: diagramfont,
			size: diagramfontsize,
			}
		},
		tickangle:90,
		tickfont:{
			family:diagramfont,
			size:diagramfontsize-5
			}

		},

	yaxis: 	{
		automargin: true,
		range:[minval,maxval],
		title: 	{
			text: 'Anzahl',
			font: 	{
				family: diagramfont,
				size: diagramfontsize,
				}
			}
		},
	annotations: watermarke()
	};

myPlot = Plotly.newPlot('myDiv', data, layout);

</script>
