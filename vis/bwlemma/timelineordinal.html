<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	diagramtitle = ""
	var dataset = getQueryVariable("data")
	var lemma = getQueryVariable("lemma")
	var exact = getQueryVariable("exact")
	var focus = getQueryVariable("focus")
	var jitter = getQueryVariable("jitter")
	if(jitter.length==0){jitter=defjitter}else{jitter = parseFloat(jitter)}
	if(focus.length==0){focus=0}else{focus = parseInt(focus)}
	dataset = dataset +"?lemma="+lemma+"&sort"
	if(focus==3){diagramtitle = "Token von Lemma "}else{diagramtitle="Lemma "}
	diagramtitle += lemma

	if(exact==1){dataset+="&exact"}else{diagramtitle += " inkl. ambig"}
	diagramtitle += "<br>" + lang_ordinal

	data_arr = readPHP(dataset).split("\n");
	if(data_arr.length>resultsetmax){document.write(lang_error_resultset_too_large);}
	else{
		maxval = 0
		minval = 10000000
		
		date= []
		count = []
		hovers = []
		colors = []

		oldval = []
		val = []


		for (var i = 0; i < data_arr.length; i++) {
			line = data_arr[i];
			if(line.length>1){
				tmp = line.split(sep)
				value = parseInt(tmp[2])
				if (tmp.length==4){token = ":"+tmp[3]}else{token=""}
				
				if (oldval[token] == undefined){
					val[token] = 1
				}
				else if(oldval[token] < value){
					val[token] += 1
				}
				else if(oldval[token] > value){
					val[token] -= 1
				}
				
				newval = val[token]
				//jittervalue = val + (jitter*(Math.random()))
				date.push(tmp[1])
				count.push(newval)
				hovers.push(tmp[0]+"("+tmp[1]+")"+token+" "+tmp[2])
				colors.push(getColor(tmp[focus]))
				if (newval<minval ){minval = newval}
				if (newval>maxval ) {maxval = newval}
				oldval[token] = value
			}
		}
		
		var data = [{
			x: date,
			y: count,
			name: 'Token Count',
			hovertemplate: '%{text}',
			type: 'scatter',
			mode: "markers",
			text:hovers,
			marker: {
				size:markersize(data_arr.length),
				color: colors,
				opaciy:0.2
			}
		}];

		var layout = {
			hovermode:"closest",
			title:{
				text:diagramtitle,
				font:diagramfont
				},
			xaxis:{
				automargin: true,
				range:[minDate-2,maxDate+2],
				linewidth: 1,
				title:{
					font:diagramfont
				},
				tickangle:90,
				tickfont:diagramfont
			},
			yaxis:{
				automargin: true,
				range:[0,maxval+maxval/10],
				title:{
					text: 'Häufigkeit (Ordinal)',
					font:diagramfont
					}
				},
			annotations: watermarke()
		};

		myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
		myPlot = document.getElementById('myDiv')
		document.title = diagramtitle
		if(parent.document.getElementById('yearminslider') != undefined){
			myPlot.on('plotly_click', function(data) {
				yearx=data.points[0].x;
				parent.exactlemma = data.points[0].text.split("(")[0].slice(1,-1)
				parent.document.getElementById("yearminvalue").innerHTML = yearx
				parent.document.getElementById("yearmaxvalue").innerHTML = yearx
				parent.document.getElementById("yearminslider").value = yearx
				parent.document.getElementById("yearmaxslider").value = yearx
				parent.updateTravizYear()
			});
		}
	}
</script>
</body>
