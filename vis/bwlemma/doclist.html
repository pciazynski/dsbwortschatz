<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>

<body style="text-align:left;">
<script>
	var dataset = getQueryVariable('data')
	var word = getQueryVariable('word')
	var lemma = getQueryVariable("lemma")
	var norm = getQueryVariable("norm")
	var year = getQueryVariable("year")
	if(lemma.length >0){
		dataset = dataset +"?lemma="+lemma+"&sort"
		diagramtitle = "Dok. Lemmatisierung:"+ lemma
		param = "&highlight="+lemma
	}else{
		if(norm.length >0){
			dataset = dataset +"?norm="+norm+"&sort"
			diagramtitle = "Dok. Normierung:"+ norm
			param = "&highlight="+norm
		}else{
			dataset = dataset +"?word="+word+"&sort"
			diagramtitle = "Dok. Wort:"+ word
			param = "&deletexml&highlight="+word
		}
	}
	if(year.length>0){diagramtitle+="<br>"+year;dataset+="&year="+year}
	data_arr = readPHP(dataset).trim().split('\n');
	
	str = '<table class="clicktable">';
	if(dataset.includes("urnbyword")){
		str += str + '<tr><th>Jahr</th><th>Tokensuche <br>(untokenisiert)</th><th>Wortverteilung <br>Dia | Data</th><th>Lese-<br>freundlich</th><th>Faksimile<br>Dig. Bibliothek</th><th>Dokument<br>CTS</th>'
	}
	else{
		str += '<tr><th>Jahr</th><th>Lesemodus</th><th>Faksimile<br>Dig. Bibliothek</th><th>Dokument<br>CTS</th>'
	}
	str += '</tr>'

	for (var i = 0; i < data_arr.length; i++) {
		arr = data_arr[i].split(sep)
		
		urnarr = arr[0].split(":")[3].replaceAll("."," ").replaceAll("_"," ").split(" ")
		tmpname = ""
		for (var j = 0; j < urnarr.length; j++){
			tmpname += " "+urnarr[j].charAt(0).toUpperCase() + urnarr[j].slice(1)
		}
		//Remove Versioning Timestamp
		tmpname = tmpname.substring(0,tmpname.lastIndexOf(" "))
		
		onclickfun0 = "window.open('"+ctsurl.slice(0,-5)+"/plain/textsearch.php?urn="+arr[0]+"&snippet="+word+"', '_blank')"
		onclickfun1 = "window.open('"+ctsurl.slice(0,-5)+"/fancy/ebook.php?urn="+arr[0]+"', '_blank')"
		onclickfun2 = "window.open('"+ctsurl+"?request=GetPassage&urn="+arr[0]+param+"', '_blank')"
		onclickfun3 = "window.open('"+ctsurl.slice(0,-5)+"/vis/textdistribution.html?urn="+arr[0]+"&snippet="+word+"&lowercase', '_blank')"
		onclickfun4 = "window.open('"+ctsurl.slice(0,-5)+"/plain/textdistribution.php?urn="+arr[0]+"&snippet="+word+"&lowercase', '_blank')"
		onclickfun5 = "window.open('https://dolnoserbski.de/biblioteka/pokaz/"+tmpname.toLowerCase().trim().replaceAll(" ","-")+"', '_blank')"
		if(dataset.includes("urnbyword")){
			str += '<tr><td>'+arr[1]+'</td><td> <span onclick="'+onclickfun0+'"> &#10008;</span> </td><td> <span onclick="'+onclickfun3+'"> &#10087;</span> | <span onclick="'+onclickfun4+'"> &#10138; </span></td><td onclick="'+onclickfun1+'"> &#x1F56E; </td><td onclick="'+onclickfun5+'"> &#128247; </td><td onclick="'+onclickfun2+'">'+resstr+'</td>'
		}
		else{
			str += '<tr><td>'+arr[1]+'</td><td onclick="'+onclickfun1+'"> &#x1F56E; </td><td onclick="'+onclickfun5+'"> &#128247; </td><td onclick="'+onclickfun2+'">'+tmpname+'</td>'
		}
		str += '</tr>'
	}
	str += '</table>';
	document.write(str)
	data_arr = ""
	str = ""
	document.title = diagramtitle

</script>
</body>
