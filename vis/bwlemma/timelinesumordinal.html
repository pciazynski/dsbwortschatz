<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	diagramtitle = ""
	var dataset = getQueryVariable("data")
	var lemma = getQueryVariable("lemma")
	var exact = getQueryVariable("exact")
	var focus = getQueryVariable("focus")
	var jitter = getQueryVariable("jitter")
	if(jitter.length==0){jitter=defjitter}else{jitter = parseFloat(jitter)}
	if(focus.length==0){focus=0}else{focus = parseInt(focus)}
	dataset = dataset +"?lemma="+lemma+"&sort"
	if(focus==3){diagramtitle = "Jahressumme Token von Lemma "}else{diagramtitle="Jahressumme Lemma "}
	diagramtitle += lemma
	
	if(exact==1){dataset+="&exact"}else{diagramtitle += " inkl. ambig"}
	diagramtitle += "<br>" + lang_ordinal

	data_arr = readPHP(dataset).split("\n");
	if(data_arr.length>resultsetmax){document.write(lang_error_resultset_too_large);}
	else{
		maxval = 0
		minval = 10000000

		aggrodata = []
		for (var i = 0; i < data_arr.length; i++) {
			if(data_arr[i].trim().length>0){
				tmp = data_arr[i].split(sep)
				if(aggrodata[tmp[1]] != undefined){
					aggrodata[tmp[1]] = aggrodata[tmp[1]] + parseInt(tmp[2])
				}
				else{
					aggrodata[tmp[1]] = parseInt(tmp[2])
				}
			}
		}
		date= []
		count = []
		oldval = 0
		val = 0
		
		for (key in aggrodata){
			date.push(key)
			if(oldval < aggrodata[key]){
				val += 1
			}
			else if(oldval > aggrodata[key]){
				val -= 1
			}
			count.push(val)
			if (val<minval ){minval = val}
			if (val>maxval ) {maxval = val}
			oldval = aggrodata[key]
		}
	

		var data = [{
			x: date,
			y: count,
			mode: 'markers',
			marker: {
				size:markersize(date.length)/2,
				opaciy:0.2,
				color:"black"
			},
			line:{
				color:"gray",
				width: 1
		}
		}];

		var layout = {
			hovermode:"closest",
			title:{
				text:diagramtitle,
				font:diagramfont
				},
			xaxis:{
				automargin: true,
				range:[minDate-2,maxDate+2],
				linewidth: 1,
				title:{
					font:diagramfont
				},
				tickangle:90,
				tickfont:diagramfont
			},
			yaxis:{
				automargin: true,
				range:[0,maxval+maxval/10],
				title:{
					text: 'Häufigkeit (Ordinal)',
					font:diagramfont
					},
					showticks:false
				},
			annotations: watermarke()
		};

		myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
	}
</script>
</body>
