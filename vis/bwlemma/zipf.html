<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<link rel="stylesheet" href="../../styles.css">
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>

<script>

	var dataset = getQueryVariable("data")
	var max = getQueryVariable("max")
	var min = getQueryVariable("min")
	var lemma = getQueryVariable("lemma")
	var limit = getQueryVariable("limit")
	data_arr = readTextFile(dataset).split("\n");
	allText=""
	maxval = 0
	diagramtitle = "Lemmahäufigkeiten"

	date= []
	count = []
	colors = []
	add = true
	if(lemma.length>0){
		add = false
	}
	if(limit.length==0 || limit>data_arr.length){limit=data_arr.length}
	limit=parseInt(limit)
	for (var i = 0; i < limit; i++) {
		line = data_arr[i];
		if(line.length>1)
		{	
			tmp = line.split(sep)
			if(lemma.length>0 && !add){
				limit = Math.min(limit+1,data_arr.length)
				if(tmp[0]===lemma){
					add = true
				}
			}
			if (!add){continue}
			value  = parseInt(tmp[1])
			if(max.length>0 & value > parseInt(max)){continue}
			if(min.length>0 & value < parseInt(min)){continue}
			date.push(tmp[0])
			count.push(value)
			colors.push(getColor(tmp[0]))
			if (value>maxval ) {maxval = value}
		}
	}

	var data = [{
		x: date,
		y: count,
		type: 'bar',
		marker: {
			color: colors
		}
	}];

	var layout = {
		barmode: 'stack',
		title:diagramtitle,
		xaxis: {
			automargin: true,
			linewidth: 1,
			title: {
				font: diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
			},
		yaxis: {
			automargin: true,
			range:[0,maxval],
			title: {
				text: 'Häufigkeit (Abs)',
				font: diagramfont
				}
			},
		annotations: watermarke()
	};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
	myPlot = document.getElementById('myDiv')
	myPlot.on("plotly_click", function(data) {
		lemma=data.points[0].x;
		parent.document.getElementById("lemma").value = lemma
		parent.updateTimeline()
	});
	document.title = diagramtitle

</script>
</body>
