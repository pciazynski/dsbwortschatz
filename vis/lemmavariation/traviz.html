<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<script src="../../lib/traviz_slim/traviz-min.js"></script>
		<link rel="stylesheet" type="text/css" href="../../lib/traviz_slim/traviz.css"></link>
		<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	</head>  
	<body>
		<div id="containerDiv"></div>
		<script type="text/javascript">
		
	var dataset = getQueryVariable("data")
	var lemma = getQueryVariable('lemma')
	dataset = dataset +'?lemma='+lemma
	if (getQueryVariable("inclusive").length>0){dataset+="&inclusive"}

	data_arr = readPHP(dataset).split("\n");
	travdata = []
	
	for (var i = 0;i<data_arr.length;i++){
		linearr = data_arr[i].split(sep)
		
		travdata.push({edition:linearr[0]+":"+linearr[1],text:linearr[1].split("").join(' ')})
	}
	
	var traviz = new TRAViz("containerDiv",{
		lineBreaks: false,
		normalize: false,
		fontSizeMin: 10, // minimum font size
		fontSizeMax: 50, // maximum font size
		fontSizeIncrease: 0.5,
		connectionType:'all'
	});
	traviz.align(travdata);
	traviz.visualize();

		</script>
	</body>
</html>
