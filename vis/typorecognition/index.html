<meta charset='utf-8'>
<head>
	<script src="../../lib/config.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src='../../_assets/datahandler.js'></script>
	<script src='../../_assets/gui.js'></script>
	<script src='../../_assets/autocomplete.js'></script>
	<link rel='stylesheet' href='../../digilabstyles.css'>
</head>
<body style='background-color:lightgray'>
<script>document.write(header())</script>
<br><br>
<br><br>

<div class = "iframediv">
	<table  align="center" style = "padding:1px;border-spacing: 2px; text-align:center;background-color:lightgray;width:100%;">
		<tr style = "text-align:right;">
			<td style = "width: 100%;">
				<button class = "iframebutton" onclick="embedding('timeline');"><script>document.write(lang_htmlembedding)</script></button>
				<button class = "iframebutton" onclick="diagrammlink('timeline');"><script>document.write(lang_fullscreen)</script></button>
				<button class = "iframebutton" onclick="datalink('timeline');"><script>document.write(lang_rawdata)</script></button>
			</td>
		</tr>
		<tr>
			<td style = "width: 100%;">		
				<iframe class="resized" width="100%" height="475px" id="timeline" scrolling="yes"></iframe>
			</td>
		</tr>
	</table>
</div>

<div class = "iframediv">
	<table  align="center" style = "padding:1px;border-spacing: 2px; text-align:center;background-color:lightgray;width:100%;">
		<tr>
			<td style = "width: 100%;">
				<iframe class='resized' width='100%' height='150' id='typolist' scrolling='yes'></iframe>
			</td>
		</tr>
		<tr>
		<table  align="center" style = "padding:1px;border-spacing: 2px; text-align:center;background-color:lightgray;width:100%;">
			<tr>
			<td style = "width: 39%;">
				<iframe class='resized' width='100%' height='100px' id='typo' scrolling='yes'></iframe>
			</td>
			<td style = "width: 60%;">
				<iframe class='resized' width='100%' height='100px' id='doclist' scrolling='yes'></iframe>
			</td>
			</tr>
		</table>
		</tr>
	</table>
</div>

<script>

	var updateWord = function(){
		if(curtypo.length>0){
			loading('doclist')
			document.getElementById('typo').src = 'item.html?data=typorecognition/typos&item='+curtypo
			document.getElementById('doclist').src = 'doclist.html?data=urnbyword.php&word='+curtypo
		}
	}
	
	var itemclick = function(item){
		curtypo = item
		updateWord()
	}
	
	var timelineclick = function(item){
		document.getElementById('typolist').src = 'itemlist.html?data=typorecognition/typowords&year='+item
		document.getElementById('typo').src = "error_selecttoken.html"
		document.getElementById('doclist').src = "error_selecttoken.html"
	}
	
	
	document.getElementById('typolist').src = 'itemlist.html?data=typorecognition/typowords'
	document.getElementById('timeline').src = 'hist_timeline.html?data=typorecognition/typowords'
	document.title=lang_typorec
	curtypo = getQueryVariable("typo")
	updateWord()

</script>

<br><br>
<script>
	document.write(footer())
</script>

</body>
