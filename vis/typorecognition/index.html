<script>

	var updateTimeline = function(){
		if(curword.length>0){
			loading("timeline")
			loading("wordinfo")
			document.getElementById("timeline").src="timeline.html?data=tokencountperyear.php&token="+curword+"&sort"
			document.getElementById("wordinfo").src="wordinfo.html?data=token2lemma.php&token="+curword
			document.title="Wort "+curword
			document.getElementById('switchlinreg').disabled = false;
		}
	}
		
	curword = getQueryVariable('word')
	if(curword.length>0){
		updateTimeline()
		document.getElementById("wordinfo").scrollIntoView()
	}
	else{
		document.getElementById('wordinfo').src="error_token.html"
		document.getElementById('timeline').src="error_token.html"
	}
	

	document.title="Token "+token

</script>
