<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/config.js"></script>
	<script src="../../_assets/datahandler.js"></script>
</head>

<body>
<div id="myDiv"></div>
<script>

	var dataset = getQueryVariable("data")
	var tag = getQueryVariable("tag")
	var token = getQueryVariable("token")
	dataset = dataset +"?token="+token+"&tag="+tag
	data_arr = readPHP(dataset).split("\n");
	str = '<table style="border-collapse: collapse;">';
	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr [i];
		if(line.length>1)
		{	arr = line.split(sep)
			str = str + '<tr><td style="border: 1px solid black;padding:5px 5px 5px 5px;"><a target="_blank" href="'+ctsurl+'?request=GetPassage&highlight='+token+'&deletexml&urn='+arr[0]+'">'+arr[0]+'</a></td>'
			for (var j = 1;j<arr.length;j++)
			{
				str = str + '<td style="border: 1px solid black;padding:5px 5px 5px 5px;">'+arr[j]+'</td>';
			}
			str = str +"</tr>"
		}
	}
	str = str + "</table>";
	var node = document.getElementById('myDiv');
	node.innerHTML=str;

</script>
</body>
