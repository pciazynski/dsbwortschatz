<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="../../lib/css/leaflet.css">
	<script src="../../lib/js/leaflet.js"></script>
	<script src="../../lib/config.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<style>
	html, body, #mymap {
		width: 100%;
		height: 100%;
		padding: 0;
		margin: 0;
	}
	.label{text-align:center;}
	</style>
</head>
<body>
<div id="mapid" style="width: 100%; height: 700px"></div>
<script>

	data = getQueryVariable("data")
	maptype = getQueryVariable("maptype")
	if(maptype.length==0){maptype="bundeslaender"}

	lang = getQueryVariable("lang").toLowerCase()
	data_arr = readTextFile(data).split("\n");

	var mymap = L.map('mapid');
	mymap.createPane('polygons');
	mymap.createPane('circlemarkers');
	mymap.getPane('circlemarkers').style.zIndex = 2;
	mymap.getPane('polygons').style.zIndex = 1;

	design = {
		pane: 'polygons',
		onEachFeature: function(feature, featureLayer) {
			featureLayer.bindPopup(feature.properties.name);
		},
		style: function(feature) {return {
			opacity: 1,
			weight: 0.2, 
			color: "black",
			fill: true,
			fillOpacity: 1,
			fillColor: "white"
	};}}

	loadGeojson(maptype+".geojson", design)

	function circleClick(e) {
		var clickedCircle = e.target;
		token = clickedCircle.getPopup().getContent().split(">")[1].split("<")[0]
		stemmings = readPHP("stemmings.php?token="+token+"&tag=PLACE");
		parent.document.getElementById("token").value = stemmings.replaceAll("\n",",")
		parent.document.getElementById("stemmings").src = "tokenlist.html?data=stemmings.php&token="+token+"&tag=PLACE"
		parent.updateTimeline()
		e.target.openPopup();
	}

	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr[i]
		if(line.trim().length>0){
			arr = line.split(sep);
			coord = arr[2].split("_")[1].split(",");
			cl = getColor(arr[0])
			if(coord.length==2 && arr[2].toLowerCase().startsWith("place_"+lang)){
				var circle = L.circleMarker(coord, {
					pane:'circlemarkers',
					weight: 2, 
					color: cl,
					fillColor: cl,
					fillOpacity: 0.1,
					radius: Math.log10(arr[1])*2
				}).bindPopup(
				'<span style="color:'+cl+';">'+arr[0]+'</span>'
				+'<br><a href="https://www.google.com/maps/?q=&layer=c&cbll='+coord+'" target="_blank">Street View (Externer Link)</a>').addTo(mymap)
				.on({
			'click': (e) => { circleClick },
			'mouseleave': (e) => { updateIcon(marker, normal);    $(this).off() }
		})
		.on("click", circleClick)
		//.on("mouseout", function(ev) {ev.target.closePopup();})
		.on('mouseover',function(ev) {ev.target.openPopup();});
		}}
	}
	
</script>
</body>
