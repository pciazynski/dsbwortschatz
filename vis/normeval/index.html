<script>
	var diatype = function(id, diatype){
		loading(id)
		srctmp = document.getElementById(id).src = diatype+".html"+document.getElementById(id).src.split(".html")[1]
	}

	var updateFocus = function(newfocus){
		loading("timeline")
		focus = newfocus
		sourcearr = document.getElementById("timeline").src.split("&focus=")
		source = sourcearr[0]+sourcearr[1].slice(1)+"&focus="+focus
		if(focus==3){
			source = source.replace("normsumperyear","normcountperyear")}else{source = source.replace("normcountperyear","normsumperyear")
		}
		if(curnorm.length>0){
			document.getElementById("timeline").src=source
			document.title="Normierung "+curnorm
		}
	}
	
	var updateZipf = function(){
		loading("zipf")
		loading("stats")
		loading("piebox")
		document.getElementById("zipf").src="zipf.html?data=normmapping/_normuniqueness"
		document.getElementById("piebox").src="piechart.html?data=normmapping/_normuniqueness"
		document.getElementById("stats").src="basics.html?data=normmapping/_normuniqueness"
	}
	
	var pointClick = function(norm, hover){
		document.getElementById("normtext").innerHTML = hover
		document.getElementById("norm").value = norm
		updateTimeline()
	}
	
		
	var normClick = function(norm){
		if(focus==3){funcall = "normcountperyear"}else{funcall="normsumperyear"}
		if(norm.length>0){
			document.getElementById("timeline").src="timeline.html?data="+funcall+".php&norm="+norm+"&sort&exact=1&focus="+focus
			document.getElementById("tokengroup").src="tokenlist.html?data=normtoken.php&norm="+norm+"&sort&exact=1"
		}
	}

	var updateTimeline = function(){
		loading("timeline")
		loading("normgroup")
		loading("tokengroup")
		curnorm = document.getElementById("norm").value.trim()
		if(focus==3){funcall = "normcountperyear"}else{funcall="normsumperyear"}
		if(curnorm.length>0){
			document.getElementById("timeline").src="timeline.html?data="+funcall+".php&norm="+curnorm+"&sort&focus="+focus
			document.getElementById("normgroup").src="normlist.html?data=normgroup.php&norm="+curnorm+"&sort"
			document.getElementById("tokengroup").src="tokenlist.html?data=normtoken.php&norm="+curnorm+"&sort"
		}
		document.title="Normierung "+curnorm
	}

	focus = 0
	updateZipf()
	//document.getElementById('zipf').src="zipf.html?data=lemmamapping/_lemmabag&min=1000"

	document.title="Norm. Evaluation"

</script>
