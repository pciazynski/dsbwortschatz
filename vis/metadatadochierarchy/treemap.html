<!doctype html>
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<div id="myDiv" style="width: 100%;height:100vh;"><!-- Plotly chart will be drawn inside this DIV --></div>

<script type = "module">

	var dataset = getQueryVariable('data')
	dataset+="?sort"
	var diagramtitle = dataset
	var data_arr = (await readPHP_async(dataset)).trim("\n").split('\n');
	var i;
	var date = []
	var parents = []
	var ns = "urn:cts:"+data_arr[0].split(":")[2]+":"
	date.push(ns)
	parents.push("")
	var included = []
	var parentsincluded = []
	for (i = 0; i < data_arr.length; i++) {
		var linearr = data_arr[i].replaceAll("con","con").split(sep)
		var urnarr = linearr[0].split(":")
		var docurnarr = urnarr[3].split(".")
		var urnpart = ns
		var oldurn = ns
		for (var j = 0;j<docurnarr.length;j++){
			urnpart += docurnarr[j]+".";
			if (included[urnpart] == null){
				date.push(urnpart)
				parents.push(oldurn)
				included[urnpart]=1
			}
			oldurn += docurnarr[j]+".";
		}
	}
	
	
	var data = [{
		type: "treemap",
		labels: date,
		parents: parents

	}];
	var layout = {
		annotations: watermarke()
	};

	Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
	var myPlot = document.getElementById('myDiv')
	
</script>
</body>
