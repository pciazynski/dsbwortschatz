<!DOCTYPE html>
<meta charset='utf-8'>
<head>
	<script src="../../lib/config.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src='../../_assets/datahandler.js'></script>
	<script src='../../_assets/gui.js'></script>
	<script src='../../_assets/autocomplete.js'></script>
	<link rel='stylesheet' href='../../digilabstyles.css'>
</head>
<body style='background-color:lightgray'>
<script>document.write(header())</script>
<br><br>
<br><br>

<div class = 'explain'>
	<p>
		Hier können Dokumente gelistet werden, die ein angegebenes Token enthalten. Die Dokumente werden auch auf einer Zeitleiste positioniert.<br>
		Ein Klick auf die URNs in der Liste öffnet das Dokument über einen CTS Request und highlighted dabei das Token.
	</p>
</div>

<table class='optionmenu' align='center'>
	<tr>
		<td style='text-align:center;'>Token</td>
		<td>
			<div class='autocomplete'>
				<input style='width:70%' id='token' type='text' placeholder='Token'>
				<button onclick = 'updateToken()'>Enter</button> 
			</div>
			<script>
				autocomplete('token', 'prefixsearch.php?&cutoff=2&limit=20&token=', ''); 
			</script>
		</td>
		<td>
			<a href="?token=bismark">Beispiel Bismark</a>
		</td>
	</tr>
	<tr>
		<td style='text-align:center;'>Lemma</td>
		<td>
			<div class='autocomplete'>
				<input style='width:70%' id='lemma' type='text' placeholder='Lemma'>
				<button onclick = 'updateLemma()'>Enter</button> 
			</div>
			<script>
				autocomplete("lemma", "prefixlemmasearch.php?&cutoff=2&limit=20&lemma=", ""); 
			</script>
		</td>
		<td>
			<a href="?lemma=BISMARCK">Beispiel BISMARCK</a>
		</td>
	</tr>
</table>
<br><br>

<div class = "iframediv">
	<table  align="center" style = "padding:1px;border-spacing: 2px; text-align:center;background-color:lightgray;width:100%;">
		<tr style = "text-align:right;">
			<td style = "width: 69%;">
				<button class = "iframebutton" onclick="embedding('timeline');"><script>document.write(lang_htmlembedding)</script></button>
				<button class = "iframebutton" onclick="diagrammlink('timeline');"><script>document.write(lang_fullscreen)</script></button>
				<button class = "iframebutton" onclick="datalink('timeline');"><script>document.write(lang_rawdata)</script></button>
			</td>
			<td style = "width: 30%;">
				<button class = "iframebutton" onclick="embedding('doclist');"><script>document.write(lang_htmlembedding)</script></button>
				<button class = "iframebutton" onclick="diagrammlink('doclist');"><script>document.write(lang_fullscreen)</script></button>
				<button class = "iframebutton" onclick="datalink('doclist');"><script>document.write(lang_rawdata)</script></button>
			</td>
		</tr>
		<tr>
			<td>		
				<iframe class='resized' width='100%' height='475px' id='timeline' scrolling='yes'></iframe>
			</td>
			<td>		
				<iframe class='resized' width='100%' height='475px' id='doclist' scrolling='yes'></iframe>
			</td>
		</tr>
		<tr style = "text-align:right;">
			<td>
				<button class = 'iframebutton' onclick='hidewatermark("timeline");'><script>document.write(lang_source)</script></button>
			</td>
			<td>
			</td>
		</tr>
	</table>
</div>


<script>

	var callDolnoserbski = function(){
		tmp = document.getElementById('token').value.trim()
		if(tmp.length>0){
			window.open('https://dolnoserbski.de/ortografija/slownik?wuraz='+tmp, '_blank')
		}
	}
	
	var updateToken = function(){
		tmp = document.getElementById('token').value.trim()
		if(tmp.length>0){
			loading('timeline')
			loading('doclist')
			document.getElementById('doclist').src = 'doclist.html?data=urnbyword.php&token='+tmp
			document.getElementById('timeline').src = 'timeline.html?data=urnbyword.php&token='+tmp
			document.title=tmp+" Dok.nachweise "
		}
	}
	
	var updateLemma = function(){
		tmp = document.getElementById('lemma').value.trim()
		if(tmp.length>0){
			loading('timeline')
			loading('doclist')
			document.getElementById('doclist').src = 'doclist.html?data=urnbyword.php&lemma='+tmp
			document.getElementById('timeline').src = 'timeline.html?data=urnbyword.php&lemma='+tmp
			document.title=tmp+" Dok.nachweise "
		}
	}
	

	
	document.title="Dok.nachweise"
	tmplemma = getQueryVariable('lemma')
	if(tmplemma.length>0){
		document.getElementById('lemma').value = tmplemma
		updateLemma()
	}
	else{
		document.getElementById('token').value = getQueryVariable('token')
		updateToken()
	}

</script>

<br><br>
<script>
	document.write(footer())
</script>

</body>
