<!DOCTYPE html>
<meta charset="utf-8">

<head>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<script src="../../_assets/gui.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>

<body style="background-color:lightgray">

<script>document.write(header())</script>
		
<br><br>

<div class="explain">
	<p>
		Hier Text einfügen:
	</p>
</div>

<table class='optionmenu' align='center'>
	<tr>
		<td>
			<textarea  style="width:90%;height:200px;" value = "" type="text" id="inputtext" onchange="recognise()"></textarea >
		</td>
	</tr>
</table>

<br>
<div class = "explain">
	<p>
		<span style="color:green;"> ▮ </span>Bestätigt DSB<br>
		<span style="color:blue;"> ▮</span><span style="color:cyan;">▮ </span>Unsicher<br>
		<span style="color:red;"> ▮ </span>Deutsch<br>
		<span style="color:black;"> ▮ </span>Wort nicht als Trigramm vorhanden<br>
		
	</p>
</div>
<table class='optionmenu' align='center'>
	<tr>
		<td>
			<div style="width:90%;background-color:white;">
				<label  style="width:90%;height:200px;" value = "" type="text" id="langrec" onchange="recognise()"></label >
			</div>
		</td>
	</tr>
</table>
<script>

	var recognise = function(){
	var punctRE = /[\u2000-\u206F\u2E00-\u2E7F\\'!"#$%&()*+,.\/:;=?@\[\]^_`{|}~]/g;
		document.getElementById('langrec').innerHTML = "Loading..."
		text = " "+document.getElementById("inputtext").value.replaceAll("\n", ' <br> ').replace(punctRE, ' ').toLowerCase()+" "
		textarr = text.split(" ").sort()
		oldtoken = ""
		dsblist = "\n"+readTextFile("langDetect3/dsb");
		mix1list = "\n"+readTextFile("langDetect3/mix1");
		mix2list = "\n"+readTextFile("langDetect3/mix2");
		deulist = "\n"+readTextFile("langDetect3/deu");
		for (var i = 0;i<textarr.length;i++){
			token = textarr[i].trim()
			if(oldtoken!== token){
				onclickfun = "window.open('../../vis/bwtoken/?token="+token+"')"
				if(dsblist.includes("\n"+token+"\t")){
					text = text.replaceAll(" "+token+" ", ' <span class="clickabletoken" style="cursor:pointer;color:green;" onclick="'+onclickfun+'">'+token+'</span> ')
				}
				else {
					if(mix1list.includes("\n"+token+"\t")){
						text = text.replaceAll(" "+token+" ", ' <span class="clickabletoken" style="cursor:pointer;color:cyan;" onclick="'+onclickfun+'">'+token+'</span> ')
					}
					else{
						if(mix2list.includes("\n"+token+"\t")){
							text = text.replaceAll(" "+token+" ", ' <span class="clickabletoken" style="cursor:pointer;color:blue;" onclick="'+onclickfun+'">'+token+'</span> ')
						}
						else{
							if(deulist.includes("\n"+token+"\t")){
								text = text.replaceAll(" "+token+" ", ' <span class="clickabletoken" style="cursor:pointer;color:red;" onclick="'+onclickfun+'">'+token+'</span> ')
							}
						else{
								text = text.replaceAll(" "+token+" ", ' <span class="clickabletoken" style="cursor:pointer;color:black;" onclick="'+onclickfun+'">'+token+'</span> ')
							}}}}
				oldtoken = token
			}
		}
		
		document.getElementById('langrec').innerHTML=text
	}
	document.title="Sprachmarkierung"


</script>

<br><br>

<script>
	document.write(footer())
</script>

</body>
