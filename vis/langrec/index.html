<script>
	text =  "Huzmy źiſchi ßerbſki zytaſch ( laſowaſch ) a pißaſch ! Chudy muž . Chudy a niſki ja ßom A pſchezej woſtańom ; Sa to pak ſpokojny , Strowy a wjaßoły ; Ten pokład nejlěpẜchy jo , Tyßazam t. j. towſyntam . goŕej ße źo . Młogi ma ṕeńes ẜchak doſcź , Jo gjardy kněs — ẃelizkoſcź ! — Małko pak wjaßela W ßwěſche won hužywa , S choroſcźu ma ße won biſch , Bědńe ße ẃergaſch a wiſch . Debu tež zaßy ße drěſch , Gdyž ßwoj kußk klěba zu měſch : Weto pak hutẜchoba Spuẜchcźa ße na Boga ; Bogatu ruku Bog ma , Gdyž won zo , do doſcźi da . K źěłu Bog poſtawił mńo Kaž ptaẜchki k lětańu jo ; Zo ga mě ẜchkoźi to ? Béru to ſa lubo . Spẜchawńe a zeßńe ße zu Hobchadaſch tu w žyẃeńu . Wot H. Sejleŕa † . Robinſon . Rědne hulizowańe woßeb́e ſa młodych luźi . Pěty wjazor . Se ßwitanim holěſe Robinſon ſe ßwojogo boma a běžaẜcho k morju pytat někotare hawſtry . Won běžaẜcho po nejbližẜchej droſe a duzy nadejźe bom , kakiž hyẜchcźer doněta ńeběẜcho wiźeł . Ten bom běẜcho hußozki , ńemějaẜcho pak žednych gałuſow , ale jano na ẃeraẜchku gałmot ẃelikego liſtu . Pod bomom Robinſon namaka ẃeliki płod , tak ẃeliki kaž źiſcheza głowa , a gorějkach hyẜchcźer wězej takich płodow wißaẜcho . Płod běẜcho tſchigrańaty abo „ na tſchi grani “ , łuſcźina ( łupina ) běẜcho ẃelgin tłuſta a běẜcho kaž gromadu ſlipane lanowe gjarſtki ; ſpod łupinu běẜcho druga ẃelgin twarda ẜchkorpina abo běliſń . Robinſon daniž płoda daniž boma ńeſnajaẜcho , myßlaẜcho ße pak , až jo płod k jěźeńu . Wenkownu łupinu hoběli a ẜpodnu nutſchkownu potom ſ kaḿeńom rosbi . Nutſchikach namaka jědro , telike kaž gußeze jajo ; to ßłoźaẜcho ße kaž nejlěpẜche woŕechy ; tež běẜcho běła ſupa hokoło jědra ; ta běẜcho dobra kaž młoda ſḿatana . Na tom boḿe ſ takimi dobrymi płodami ße ẃelgin ſwjaßeli . A dokulaž głoźaẜcho , wotkłoſchi wězej takich płodow a najě ße jich . Jan : „ Kaki ga běſcho ten bom ? “ Bjarnat : „ To běẜcho kokos-palma . Palmow jo ẃelgin ẃele družynow ( roźinow ) a ẜchykne roſtu w gorězych krajach . “ Nan : A rownož běẜcho ße Robinſon kokoßowych woŕechow najědł , běžaẜcho weto k morju ſaß po hawſtry glědat . Won jich jano małutſchko namaka a wjaßelaẜcho ße togodla ſchym wězej , až běẜcho nězo druge a lěpẜche k jěźi namakał . Te hawſtry weſe ſeßobu k hob́edu , tež naſběra ßeb́e proſne hawſtrowy ẜchkorpiny a weſe je ſe ßobu . Dokulž łopaty daniž motyjki ńemějaẜcho , myßlaẜcho ße , až možo ſ tymi ẜchkorpinami źěry do ſemje ryſch a bomki ßaźaſch . Tak ßaźaẜcho won hobſtawńe bomki a naßaźa jich zeły rěd wot jadnogo boka gory až k drugemu dopołhokolize a naßaźa je pẜchaẃe guſto , jaden pſchi drugem a hoblěwaẜcho je kužde žajtẜcho a wjazor ſ wodu , aby lěṕěj roßli . Na janom rěźe bomkow pak jomu ńeběẜcho doſcź , ale naßaźa tſchi kẜchozeńe dalej ſaßej taki rěd a potom hupołni pſcheſtrěń ( rum ) mjaſy rědoma ſe ſemju . Tak naſta twardy pěſkowy naßyp , pſches kotryž bžes ẃelikeje prozy nichten ńamžaẜcho . Aby Robinſon ńeměł hobſtawńe ſchěžkeg źěła , bělaẜcho łyko wot kokoßowoŕechowych łupinow a pleſcheẜcho ſ nich niſchi a powŕoße ( ẜchtryki ) a hupleſche a ſwěſa ßeb́e jab́eŕ . Ten pſchiwěſa ſa ṕenk togo boma , kenž nad jogo jamu na goŕe ſtojaẜcho , aby mogł po ńom ſe ßwojogo ſ'chowa wen a ſaßej nutſch pſchiſch , gdyž ße jomu lubjaẜcho , nichten pak k ńomu , kenž to ńeſnajaẜcho ; pſcheto won ße ẃelgin bojaẜcho pſched źiwimi luźimi . Hobßaźa a hupołni togodla tež poßlědnu źěru w pěſkowem naßyṕe , kotruž běẜcho do něta wotzyńonu woſtawił . Pěſk a kaḿeńe ſa naßyp b́eŕaẜcho ſe ßwojeje gory a woßeb́e ſ jamy a ſzyni ju ſ tym ẃele wětẜchu a ẜchyrẜchu . Tež běẜcho ſ rukoma tẜchawy wottergał a ßuẜchył a tak mějaẜcho ßeno : to ſnoßy do ßwojeje jamy a ſzyni ßeb́e poſtolu a něto možaẜcho ſaßej w nozy lažaſch kaž luźe , ńetŕebaẜcho wězej na boḿe ſpaſch kaž ptaẜchki . A ſa taku nowu dobrotu ńeſaby ße Bogu źěkowaſch . Bližẜchy źeń běẜcho ſaßej ńeźela . Won ju ßwěſchaẜcho kaž pẜchawy kſcheſcźijan zyni ; won ße woſtawi ẜchednego źěła , ſpiwaẜcho kjarliže a modlaẜcho ße , ſpominaẜcho na Boga a ſtaraẜcho ße ſa ßwoju ńeßḿertnu duẜchu . Wotpołdńa ße pſchechojźowaẜcho dalej , ńežli běẜcho ṕerẃej pſchiẜcheł a namaka kaḿeńe , na kotarychž ẃelgin ße wjaßelaẜcho , dokulž možaẜcho je pſchi ßwojom ẜchednem źěle deŕe nałožyſch ; woßeb́e ße jomu jaden ſeſpodoba ; ten běẜcho kaž ßekera , doſcź wotẜchy a mějaẜcho tež źěru ; ẜchykne hužytne kaḿeńe weſe ſe ßobu domoj . Aby w pſchichodnem zaßu ńeſabył na ńeźelu , ſzyni ßeb́e pratyju . To dozyni won tak : Won hubra ßeb́e ſtyri bomy , kenž bliſko gromaźe ſtojachu a gładku ẜchkoru mějachu ; do prědnego boma hurěſa ſe ßwojeju kaḿeńaneju ßekeru kuždy wjazor ſarěſnizku a gdyž běẜcho ßedym ſarěſnizkow hurěſał , ſzyni do drugego boma jadnu ſarěſnizku ; a to běẜcho něto tyźeń ; a gdyž běchu w ńom ſtyri take ſarěſnizki gromaźe ſzyni do tſcheſchego boma jadnu ſarěſnizku ; to běẜcho mjaßez a gdyž běẜcho dwanaſcźo takich ſarěſnizkow , pon běẜcho dwanaſcźo mjaßezow ſajẜchło a won hurěſa do ſtwortego boma ſarěſnizu a to běẜcho lěto . Won pak tež wěźeẜcho , kak ẃele dńow ma jano lěto a kak ẃele kuždy mjaßez ; tež wěźeẜcho , kotare jo pſcheſtupne lěto . Jan : „ Kak možaẜcho won to wěźeſch ? “ Gregoŕ : „ Gaž lětny lizbnik weſmjoẜch a źěliẜch jen ſe ſtyrku ( 4 ) : gaž ſchi pſchi tom niz huẜchej ńewoſtańo , ga jo „ pſcheſtupne “ lěto ; woſtańo -li pak nězo huẜchej , zož ße ſe ſtyrku źěliſch ńedajo , tegdy ńejo pſcheſtupne lěto . A na ßwojich palzach možoẜch ßam dolizyſch , kak ẃele ma kuždy mjaßez dńow . “ Jan : „ Kak mogu to wěźeſch ? “ Gregoŕ : „ To možoẜch tak ſgoniſch . Sazyń ßwoju lěwizu , až ßu knyžki deŕe hußoke , potom poḿenuj mjaßeze porědu kaž ſa ßobu pſchidu . Na knyžku prědnego pokaſujuzego palza — ẃely ßobu ńelizy — pſchiźo prědny mjaßez ; do depki mjaſy prědnym a ßrědnym palzom pſchiźo drugi mjaßez ; na knyžku ßrědnego palza tſcheſchi mjaßez ; do depki mjaſy ßrědnym a tſcheſchim palzom ſtworty mjaßez ; na knyžku tſcheſchego palza pſchiźo pěty mjaßez ; do depki dalej ẜcheſty mjaßez ; na knyžku małego palza padńo ßedymy mjaßez ; woßymy mjaßez padńo źož prědny — ſaßej na knyžku prědnego ( pokaſujuzego ) palza , źeẃety źož jo był drugi mjaßez , źaßety źož tſcheſchi , jadnaſty źož ſtworty a dwanaſty źož jo był pěty . Něto poßłuchaj : Kuždy mjaßez , kenž na knyžku padńo , ma jadenatſchiźaſcźa dńow ; kenž pak do depki padńo , ma jich tſchiźaſcźa ; drugi mjaßez abo „ ßwězkowny “ mjaßez ma jich woßymadwaźaſcźa a gdyž jo „ pſcheſtupne “ lěto , ma jich źeẃeſchadwaźaſcźa ; gaž to ẜcho wěẜch , možoẜch ßeb́e poł pratyje ſažariſch . “ Nan : Tak jo ; ale něto ſaßej k naẜchomu Robinſonu . Won běẜcho južor dłujko na kuṕe a běẜcho ße až do něta ſ hawſtrami a kokoßnymi woŕechami ſežywił , ale tež huſnał , až jomu ta jěź ßama ńedoßega . Won dejaẜcho togodla na to ße myßliſch , lěz ńeby nězo druge k jěźi namakał . Sse bojezy pak pſched tergatymi ſwěŕetami a źiwimi luźimi ńeby žedńe daloko wot ßwojogo bydleńa ẜcheł ; ale něto jogo nuſa k tomu nuſkaẜcho . Won hobſamknu togodla w Božem ḿeńu dalej hyſch a ße hoglědowaſch . Dokulž běẜcho na tej kuṕe ẃelgi ſchopło , ſpleſche ßeb́e Robinſon ſ ẃerbowych witkow kẜchyẜchko , pſchiwěſa ßŕeźa kij ako źaržadło a pſchikẜchy jo ſ palmowym liſtom , kenž jo ẃelgin dłujki a ẜchyroki . Tež huźěła ßeb́e ßetku ſ niſchow , aby do ńeje ſatkał , joli až nězo namaka . A naßlědku ſzyni do ßwojogo namakanego źěratego kaḿeńa toporiẜchcźo a mějaẜcho ſ takim ßekeru , doſcź godnu . Bližẜchy źeń kſchěẜcho ße w Božem ḿeńu na drogowańe hudaſch , źěẜcho togo dla źinßa rańej ſpat , aby huſpał . Naźeja dobywaŕka . Hyẜchcźer naźeja jo žywa , Moja podpora , Pſchijaſchelniza bźes gniwa , S ńebja roźona : Ńeẃedro daź ſagrima , Tẜchachy daź mě hobdawaju : Twarźe źaržym k naźeji , Wona ńepuẜchcźi ! Hyẜchcźer naźeja jo žywa , Žyẃeńe mě da , Jeje troẜcht a ßwětło kiwa , Ducha poſwiga : Neẃedro daź ſagrima , Tẜchachy daź mě hobdawaju , Twarźe źaržym k naźeji , Wona ńepuẜchcźi ! Hyẜchcźer naźeja jo žywa , Kenž mě hoplewa ; By tež łoź ras rospſchebiła Źwała wichaŕna ; Neẃedro daź ſagrima , Tẜchachy daź mě hobdawaju : Twarźe źaržym k naźeji , Wona ńepuẜchcźi ! Po H. Sejleŕu † . Gora Modimolle . Mißionſke hulizowańe . Mißionſki ßwěźeń pſchi goŕe Modimolle . Źaßeſch lět běẜcho ße minuło , až běẜcho luby mißionar Kobold hußnuł . Druge mißionary běchu jogo źěło ſwěrńe dalej wjadli . Hyẜchcźer pſcheze ße ſeleńachu a kwiſchechu bomy w ſtazionſkem gumńe ; lizba kſcheſcźijanow běẜcho ße powětẜchyła a lizaẜcho južo po ſtach ( hundertach ) a woßada ße ſgromaźowaẜcho kuždu ńeźelu w rědnej zerkwizze , kotraž běẜcho pyẜchńona ſ tormom , kotryž daloko po kraju pſchipoẃedaẜcho , až tudy kſcheſcźijany bydle . Gußłowaŕe , kenž bliſko bydlachu , běchu ße wotporali a nichten ńepoẃedaẜcho wězej wo nich . Hynakẜchy zaß běẜcho pſchiẜcheł a běẜcho wẜcho pſchenowił , jano zerẃene ſkalne murje gory Modimolle běchu ſtare woſtali a glědachu rowno kaž ṕerẃej do dalokeje doliny . 14. měrza 1884 ſchěgńeẜcho ẃelgizkano ẃele wolezych woſow mimo gory , ſe wẜchych ſtronow praſkachu mozne kẜchudy , klinzachu głoßy wolezych wotrozkow a ßwéſchachu běłe płachty pſches ſcherńowe bomy . Ssu ßnaź to nowe ſchěgi gońtwaŕow , kotrež do kraja ße hulěwaju ? Ně , luby zytaŕ , to ßu woſy mißionarow a woſy zarnych pomoznikow , woßadnych ſtarẜchych abo huzabnikow , kenž ße tudy na ẃeliki mißionſki ßwěźeń ſgromaźuju ; pſcheto luby mißionſki direktaŕd . Wangemann jo ſ Nimſkeje pſchiẜcheł a zo tudy na ſtaziji pſchi goŕe Modimolle hyẜchcźer ẃeliku ſgromaźinu woźaržaſch . Zerkwja ńamžo ẜchyknych goſcźow hobpſchiḿeſch , rownož ma pěſch ſtow ßedłow . Togodla ſchegńo ẜcho do gumna , źož ſtej hołtaŕ a pŕatkaŕńa natwaŕonej a Boža ßłužba ße pod gołym ńebjom woźaržy . Ssedym až woßym ſtow ṕerẃejẜchych tatańow pſchipoßłucha nutẜchńe a ſpiwa rědne kjarliže ſ wězejgłoßnym chorom . Źeńk ak źeń woźaržujo direktaŕ ſ mißionarami ſgromaźiny , mjas tym až kſcheſcźijany poſpołu ßłyẜchane Bože ßłowo rospominaju a ße wjaßeliju towaŕſtwa , kotrež mjaſy ßobu maju . Dwa ẃelikej woła ſtej ſarěſanej , aby luźe , kenž ßu ſ naſdala pſchichwatali , jěſcź měli . Na pětem ßwěźeńſkim dńu woźarža ße ſgromaźiſna , w kotrejž pěſcho krajne mißionary w pěſchorakich afrikańſkich rězach lube ßłowo wo Božej ſmilnoſcźi pŕatkowachu a chwalachu , a pſchichodny źeń ßejźeẜchtej dwa lubej zarnej muža , Thimotheus Sello a Mertyń Sebuẜchane , w měrẜchnikojſkej draſtẃe pſched hołtaŕom a buẜchtej „ ſapokaſanej “ , to jo : doſtaẜchtej połnu moz ako duchowna a pŕatkaŕa mjaſy ßwojimi krajanami źěłaſch . Ḿertyń Sebuẜchana běẜcho prědny ſ luda ſłego krala Sekukuni ; won jo ſchěžko ſcherṕeł w tom zaßu , gdyź ten tatańſki kral kſcheſcźijanow ßuroẃe pſchegońowaẜcho . Won běẜcho ſ pſchijaſchelſtwa gußłowaŕow , kenž ßu na goŕe Modimolle ṕerẃej ßwoje zartojſke nałogi měli . Něto ten muž , kotryž buźaẜcho ßam ße gußłowaŕſtwu powdał , ńebuźaẜcho -li Bog luby Kněs jogo pſchimnuł ſ mozu ßwojogo ßwětego Ducha , bu na tej goŕe Božy ßłužabnik mjaſy ßwojim ludom . — Luby zytaŕ , ńejßu to zełe kẜchaßne a źiwne dobyſcha evangelija , gdyž možo ße taki mißionſki ßwěźeń na tej goŕe ßwěſchiſch , kotraž jo ṕerẃej měſto tak žadławych tatańſkich grěchow była ? Mißionſka ſtazija Waterberg , to jo : „ wodna gora “ jo ſnańkſtwo ſa to , až jo rědńe ſaßwitało nad Afriku . Jo „ ten lud , kotryž pojſchḿe chojźi , wiźi ẃelike ßwětło , a nad tymi , kenž bydle w ſchamnem kraju , ßwěſchi ße bytſcho ! “ Wy pak ẜchykne , wy lube pſchijaſchele a pſchijaſchelnize , wjaßelſcho ße pospolu , až ſcźo ſe ßwojeju prozu a źěłom , ſ darami a modlitwami ßobu pomogaſch mogli , až jo ße kraloju zeſcźi tudy droga pſchigotowała ! Dokulž pak Bog luby Kněs take žognowańe na naẜch luby mißionſki ſtatk w Afriſkej kłaźo , ga buźmy ẜchykne ſwěrńejẜche w ßwojom źěłańu a w ßwojich modlitwach ſa tatańow ! — — Roſymnoſcź pßow . II. Pßy maju pſchiroźony nałog pozyniſch deŕe ; tudy ſmějoẜch nowy pſchikład ſa podporu togo grona : Někaki rybak bydlezy we Pariſu mějaẜcho ẃelikego pßa , kotaregož ẃelgin lubowaẜcho . Gdyž rybak źěłaẜcho na rěze , tegdy tež Turko — tak grońachu tomu pßoju — pilńe ße ſtaraẜcho ſa hužytk ßwojogo kněſa a ẜchyknych luźi . Glědajuzy na to , zož ße hokoło ńogo ſta , wiźeẜcho młogi ras , kak luźe tam ße kupajuze padachu do wody a juž podmuŕachu ße , abo takich , kenž ſe ſazwiblowanim kſchěchu ßami ßeb́e žyẃeńe braſch . Tegdy — takich hupytajuzy — ned chyſchi ße do rěki a humožaẜcho podnuŕezych zeſto ſ ńemałkeju prozu a woßebneju tẜchachotu . Běẜcho pak rowno ſtaroſcźiwy wo wězy a ẃelekrot ( zeſto ) , gaž běẜcho złoẃekoju žyẃeńe humogł , woſṕet ſkozaẜcho do wody a hupſchińaßeẜcho jomu tež jogo chudutſchku maẜchnoſcź . Pſchezej wězej rosẜchyŕaẜcho ße poẃeſcź wo tak dobrych pozynkach a ſtatkach Turka . Raźze měſta Pariſa ſawołachu jogo kněſa , pochwalachu jogo , až tak hužytnego pßa ma a ße źěkowachu jomu , až jogo k tomu jo wotẜchtapił . „ Won ßam jo nahuknuł , “ wotgroni rybak , „ ßam ſe ßwojeje wole a ſe ßwojogo pſchiroźenego pogońeńa . „ Jo -li to tak , “ wotgronichu , „ dejẜch tež pſchezej pilńe ße ſtaraſch wo tak droge ſwěŕe . Wot źinßajẜchnego dńa pſchipokažo měſto Paris jomu — tomu pßoju — 350 liwrow ( huẜchej 1000 markow ) ako žywnoſtne ṕeńeſe . W terminach płaſcheńa ty pſchiẃeźoẜch pßa ſe ßobu do kaßy , aby měli ſnankſtwo wo jogo žyẃeńu . “ Tomas , rybak , ſa kogož te ṕeńeſe běchu ẃelika pomoz w ſdźaržańu ßwojeje ẃelikeje roźiny ( ßwojźby ) , ße źěkowaẜcho raźe a źěẜcho ſpěẜchńe k žeńſze , aby jej hulizował to gluzne tẜchojeńe . Turko ńepokaſaẜcho ße ńeźěkowny a wono ńeběẜcho dńa , w kotaremž ńeby humogł złoẃeka . Juž běẜcho ße ſeſtarał , gdyž ras ßejźezy po ßwojom nałogu nad bŕogom wody , hupyta , až wojak — juž pſchilětny — we małem zołnku pſches Seine ( huŕaknij : Ssejn ) pſchejěſdźezy , paźe do wody ſ raſom ſe ßwojim bundliẜchkom . Turko wiźezy tẜchachotu togo złoẃeka , chyſchi ße do rěki a popadnu jogo w tom hokognuſchu , gdyž juž woda jog horywaẜcho na dno . Polejniza běẜcho ẃelgin wotẜcha na tom měſcźe a bědnemu Turkoju bu ſchěžke do bŕogu pſchedoplěſch . Weto ńepuẜchcźi wojaka ; pſchejachly a ſkoro bžes mozow huſchegnu jogo na bžestẜchaẜchne měſto . Swjaßelony až jomu to ße raźiło běẜcho , ménił weto , až hyẜchcźer ẜchykno ńedozynił běẜcho . Bundliẜchk běẜcho hyẜchcźer we woźe . Turko huda ße naſṕet do rěki , ße nurka a pytujo a ako jo nadejẜcheł , ſchěgńo ſ prozowanim do bŕogu . Južor pak jomu mozy ńedoßegaju wězej , ſe ßlědnym napinanim doplějo až do bŕoga , huſchegńo bundliẜchk a kładajuzy jen pſched wojakom hudychńo a mrějo glědajzy na ßwojogo kněſa połny źěkownoſcźi a tužyze . Naẜchym zytaŕam ! Staraj ße kuždy po ßwojich mozach wo rosẜchyŕańe naẜcheje Serbskeje hutřoby mjaſy ßerbſkim ludom ! Kuždemu ßerbſkemu domu tež ßwoja Serbska hutřoba ! Tſchiźaſcźa ṕeńeẜchkow hyẜchcźer kuždy nan abo kužda maſch po b́ertyllěſche ma huẜchej , až možo ßeb́e a ßwojim źiſcham Serbsku hutřobu hobſtaraſch . Ꞩchym wězej woteb́eraŕow a zytaŕow , tym wětẜcha tež a zeſcźejẜcha buźo naẜcha Serbska hutřoba . Hobſtarajſcho ju tež młodym ßerbſkim luźam , waẜchym ßynam a źowcžam , bratẜcham a ßotẜcham we měſcźe a w Barlińu abo hynźo w zuſb́e w ßłužb́e ſtojezym ! Redakzija a ekspedizija Serbskeje hutřoby . Pẜchaẜchańa ſ biblije . 7. W nowem teſtamenſche možoẜch tſchoch wojakow namakaſch , kenž ßu doſtojne pozeſcźowańa a luboſcźi kſcheſcźijanow . Kotare wojaki to ßu ? 8. Źo w ßwětem pißḿe hulizujo ße wo mißionſkich ßwéźeńach ? 9. Kaki kral mějaẜcho ſtyrźaſcźa tyßazow ( 40 000 ) końow w ßwojej końezej groźi ? Sserbſke źiſchi , huknijſcho tež ßami ßerbſki pißaſch a zytaſch ( laſowaſch ) ! "
