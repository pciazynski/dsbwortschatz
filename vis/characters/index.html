<script>

	var switchpercenttimeline  = function(elid){
		tmp = document.getElementById(elid)
		url = tmp.src.replaceAll('linreg_chart.html','timeline.html')
		if(url.includes("percenttimeline")){
			tmp.src = url.replace("percenttimeline.html","timeline.html")
		}else{
			tmp.src = url.replace("timeline.html","percenttimeline.html")
		}
	}


	var empty = function(iframeid){
		loading(iframeid)
		tmp = document.getElementById("charinput").value.trim()
		if(tmp.length>0){
			if(document.getElementById(iframeid).src.includes("&char=")){
				document.getElementById(iframeid).src="timeline.html?data=charcountperyear.php&sort"
				document.getElementById('switchlinreg').disabled = true;
			}else{
				document.getElementById(iframeid).src="timeline.html?data=charcountperyear.php&char="+tmp+"&sort"
				document.getElementById('switchlinreg').disabled = false;
			}
		}
	}
	
	var linreg = function(iframeid){
		loading(iframeid)
		tmp = document.getElementById("charinput").value.trim()
		if(tmp.length>0){
			if(document.getElementById(iframeid).src.includes("timeline.html")){
				document.getElementById(iframeid).src="linreg_chart.html?data=charcountperyear.php&char="+tmp+"&sort"
			}else{
				document.getElementById(iframeid).src="timeline.html?data=charcountperyear.php&char="+tmp+"&sort"
			}
		}
	}

	var addToList = function(){
		loading("timeline")
		tmp = document.getElementById("charinput").value.trim()
		tmp2 = document.getElementById("charlistinput").value.trim()
		str = ""
		if(tmp.length>0){
			if(tmp2.length>0){str = ","}
			str = tmp2+str+tmp
			document.getElementById("charlistinput").value = str
			updateTimelineList()
		}
	}

	var updateTimelineList = function(){
		loading("timeline")
		tmp = document.getElementById("charlistinput").value.trim()
		if(tmp.length>0){
			document.getElementById("timeline").src="timeline.html?data=charcountperyear.php&char="+tmp+"&sort"
			document.getElementById('switchlinreg').disabled = true;
		}
	}

	var updateTimeline = function(){
		loading('doclist')
		loading("timeline")
		tmp = document.getElementById("charinput").value.trim()
		if(tmp.length>0){
			document.getElementById('doclist').src = 'doclist.html?data=urnbychar.php&char='+tmp
			document.getElementById("timeline").src="timeline.html?data=charcountperyear.php&char="+tmp+"&sort"
			document.getElementById('doctimeline').src = 'doctimeline.html?data=urnbychar.php&char='+tmp
			document.getElementById('switchlinreg').disabled = false;
			document.getElementById('switchallorselected').disabled = false;
			document.getElementById('switchallorselected').disabled = false;
		}else{
			document.getElementById('timeline').src="timeline.html?data=charcountperyear.php&sort"
			document.getElementById('switchlinreg').disabled = true;
			document.getElementById('switchallorselected').disabled = true;
			document.getElementById('switchallorselected').disabled = true;
		}
		document.title="Zeichen "+tmp

	}
	var updateZipf = function(){
		loading("zipf")
		tmpyear1 = parseInt(document.getElementById("yearminslider").value)
		tmpyear2 = parseInt(document.getElementById("yearmaxslider").value)
		if(tmpyear1 == tmpyear2){
			document.getElementById("zipf").src="zipf.html?data=charactersperyear/"+tmpyear1
			document.getElementById("charlist").src="charlist.html?data=charactersperyear/"+tmpyear1
		}
		else{
			if(tmpyear1 == minDate && tmpyear2 == maxDate){
				document.getElementById("zipf").src="zipf.html?data=characters/_all"
				document.getElementById("charlist").src="charlist.html?data=characters/_all"
			}
			else{
				document.getElementById("zipf").src="zipf.html?data=charcountdaterange.php&sort&year=BETWEEN "+tmpyear1+" AND "+tmpyear2
				document.getElementById("charlist").src="charlist.html?data=charcountdaterange.php&sort&year=BETWEEN "+tmpyear1+" AND "+tmpyear2
			}
		}
	}

	updateZipf()
	
	character = getQueryVariable('char')
	if(character.length>0){
		document.getElementById('char').value=character
	}
	updateTimeline()

	document.title=lang_characters+' '+character

</script>
