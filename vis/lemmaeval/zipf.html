<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<link rel="stylesheet" href="../../styles.css">
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>

<script>

	var dataset = getQueryVariable("data")
	data_arr = readTextFile(dataset).split("\n");
	allText=""
	maxval = 0
	diagramtitle = "Lemmaeindeutigkeit"

	date= []
	count = []
	colors = []
	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr[i];
		if(line.length>1)
		{	
			tmp = line.split(sep)
			value  = parseFloat(tmp[1])
			date.push(tmp[0])
			count.push(value)
			colors.push(getColor(tmp[0]))
			if (value>maxval ) {maxval = value}
		}
	}

	var data = [{
		x: date,
		y: count,
		type: 'bar',
		marker: {
			color: colors
		}
	}];

	var layout = {
		barmode: 'stack',
		title:diagramtitle,
		xaxis: {
			automargin: true,
			linewidth: 1,
			title: {
				font: diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
			},
		yaxis: {
			automargin: true,
			range:[0,maxval],
			title: {
				text: 'Häufigkeit (Abs)',
				font: diagramfont
				}
			},
		annotations: watermarke()
	};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
	myPlot = document.getElementById('myDiv')
	myPlot.on("plotly_click", function(data) {
		lemma=data.points[0].x;
		parent.lemmaClick(lemma)
	});
	document.title = diagramtitle

</script>
</body>
