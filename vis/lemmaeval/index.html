<script>
	var updateFocus = function(newfocus){
		loading("timeline")
		focus = newfocus
		sourcearr = document.getElementById("timeline").src.split("&focus=")
		source = sourcearr[0]+sourcearr[1].slice(1)+"&focus="+focus
		if(focus==3){
			source = source.replace("lemmasumperyear","lemmacountperyear")}else{source = source.replace("lemmacountperyear","lemmasumperyear")
		}
		if(curlemma.length>0){
			document.getElementById("timeline").src=source
			document.title="Lemma "+curlemma
		}
	}
	
	var updateZipf = function(){
		loading("zipf")
		document.getElementById("zipf").src="zipf.html?data=lemmamapping/_lemmauniqueness"
	}
	
	var lemmaClick = function(lemma, hover){
		document.getElementById("lemmatext").innerHTML = hover
		document.getElementById("lemma").value = lemma
		updateTimeline()
	}
	
	var callDolnoserbski = function(){
		curlemma = document.getElementById("lemma").value.trim()
		if(curlemma.length>0){
			window.open("https://dolnoserbski.de/ortografija/slownik?wuraz="+curlemma, "_blank")
		}
	}
	
	var callLemmatree = function(){
		curlemma = document.getElementById("lemma").value.trim()
		if(curlemma.length>0){
			window.open("../lemmavariation?lemma="+curlemma, "_blank")
		}
	}
	
	var updateTimeline = function(){
		loading("timeline")
		loading("lemmagroup")
		loading("tokengroup")
		curlemma = document.getElementById("lemma").value.trim()
		if(focus==3){funcall = "lemmacountperyear"}else{funcall="lemmasumperyear"}
		if(curlemma.length>0){
			document.getElementById("timeline").src="timeline.html?data="+funcall+".php&lemma="+curlemma+"&sort&focus="+focus
			document.getElementById("lemmagroup").src="lemmalist.html?data=lemmagroup.php&lemma="+curlemma+"&sort"
			document.getElementById("tokengroup").src="tokenlist.html?data=lemmatoken.php&lemma="+curlemma+"&sort"
		}
		document.title="Lemma "+curlemma
	}

	focus = 0
	updateZipf()
	//document.getElementById('zipf').src="zipf.html?data=lemmamapping/_lemmabag&min=1000"

	document.title="Lemmaeindeutigkeit"

</script>
