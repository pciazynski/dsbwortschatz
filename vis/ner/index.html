<!DOCTYPE html>
<meta charset="utf-8">

<head>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<script src="../../_assets/gui.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>
<body style="background-color:lightgray">
<script>document.write(header())</script>

<br><br>
<br><br>

<table class="optionmenu" align="center">
	<tr>
		<td style="text-align:center;">Minimum</td>
		<td>
			<input style="width:30%;" type="number" value="1000" id="min" onchange="updateYear()">
		</td>
	</tr>
</table>

<div class = "iframediv">
	<button class = "iframebutton" onclick="embedding('zipf');">HTML Embedding</button>
	<button class = "iframebutton" onclick="diagrammlink('zipf');">Vollbild</button>
	<button class = "iframebutton" onclick="datalink('zipf');">Rohdaten</button>

	<div style="text-align:center;">
		<iframe class="resized" width="100%" height="475px" id="zipf" scrolling="yes"></iframe>
	</div>
	<button class = "iframebutton" onclick="hidewatermark('zipf');">Quellenangabe</button>
</div>

<br><br>

<table class="optionmenu" align="center">
	<tr>
		<td style="text-align:center;">Token</td>
		<td>
			<input style="width:90%" type="text" id="token" onchange="updateTimeline()">
		</td>
	</tr>
</table>

<div class = "iframediv">
<button class = "iframebutton" onclick="embedding('timeline');">HTML Embedding</button>
<button class = "iframebutton" onclick="diagrammlink('timeline');">Vollbild</button>
<button class = "iframebutton" onclick="datalink('timeline');">Rohdaten</button>

<div style="text-align:center;">
	<iframe class="resized" width="100%" height="475px" id="timeline" scrolling="yes"></iframe>
</div>
<button class = "iframebutton" onclick="hidewatermark('timeline');">Quellenangabe</button>
</div>

<br><br>
<script>

	var updateTimeline = function(){
		tmp = document.getElementById("token").value.trim()
		//document.getElementById("timeline").src="timeline.html?data=tokencountperyear.php&token="+tmp+"&sort"
		//document.getElementById("timeline").scrollIntoView({behavior:"smooth"});
	}
	var updateYear = function(){
		tmp = document.getElementById("min").value.trim()
		document.getElementById("zipf").src="zipf.html?data=entities/_all&min="+tmp
	}
	document.getElementById('zipf').src="zipf.html?data=entities/_all&min=500"
	document.getElementById('timeline').src="error_token.html"
	
</script>

<br><br>
<script>
	document.write(footer())
</script>
