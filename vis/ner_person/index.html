<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/config.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../_assets/gui.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>
<body style="background-color:lightgray">
<script>document.write(header())</script>

<br><br>
<br><br>

<table class="optionmenu" align="center">
	<tr>
		<td style="text-align:center;">Minimum</td>
		<td>
			<input style="width:30%;" type="number" value="1000" id="min" onchange="updateYear()">
		</td>
	</tr>
</table>

<div class = "iframediv">
	<button class = "iframebutton" onclick="diagrammlink('zipf');"><script>document.write(lang_fullscreen)</script></button>
	<button class = "iframebutton" onclick="datalink('zipf');"><script>document.write(lang_rawdata)</script></button>

	<div style="text-align:center;">
		<iframe class="resized" width="90%" height="475px" id="zipf" scrolling="yes"></iframe>
	</div>
	<button class = "iframebutton" onclick="hidewatermark('zipf');"><script>document.write(lang_source)</script></button>
</div>

<br><br>

<table class="optionmenu" align="center">
	<tr>
		<td style="text-align:center;">Token</td>
		<td>
			<input style="width:90%" type="text" id="token" onchange="updateTimeline()">
		</td>
	</tr>
</table>

<div class = "iframediv">
	<button class = "iframebutton" onclick="diagrammlink('timeline');"><script>document.write(lang_fullscreen)</script></button>
	<button class = "iframebutton" onclick="datalink('timeline');"><script>document.write(lang_rawdata)</script></button>

	<div style="text-align:center;">
		<iframe class="resized" width="90%" height="475px" id="timeline" scrolling="yes"></iframe>
	</div>
	<button class = "iframebutton" onclick="hidewatermark('timeline');"><script>document.write(lang_source)</script></button>
</div>

<script>

	var updateTimeline = function(){
		tmp = document.getElementById("token").value.trim()
	}
	var updateYear = function(){
		tmp = document.getElementById("min").value.trim()
		document.getElementById("zipf").src="zipf.html?data=entitiesPRE/_all&min="+tmp
	}
	document.getElementById('zipf').src="zipf.html?data=entitiesPRE/_all"
	document.getElementById('timeline').src="error_token.html"
	
</script>
<br><br>
<script>
	document.write(footer())
</script>
</body>
