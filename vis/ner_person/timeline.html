<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	var dataset = getQueryVariable("data")
	var token = getQueryVariable("token")
	dataset = dataset +"?token="+token+"&sort"
	data_arr = readPHP(dataset).split("\n");
	allText=""
	maxval = 0
	minval = 10000000

	date= []
	count = []

	diagramtitle = "Zeitverlauf " + token
	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr[i];
		if(line.length>1)
		{	
			tmp = line.split(sep)
			value  = parseInt(tmp[2])
			date.push(tmp[1])
			count.push(value)
			if (value<minval ){minval = value}
			if (value>maxval ) {maxval = value}
		}
	}

	var data = [{
		x: date,
		y: count,
		type: 'bar',
		marker: {
			color: getColor(token)
		}
	}];

	var layout = {
		barmode: 'stack',
		title:	{
			text:diagramtitle,
			font: diagramfont
			},
		xaxis: 	{
			automargin: true,
			range:[minDate,maxDate],
			linewidth: 1,
			title: {
				font: diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
		},
		yaxis: {
			automargin: true,
			range:[minval,maxval],
			title: 	{
				text: 'Häufigkeit (Abs)',
				font: diagramfont
				}
			},
		annotations: watermarke()
		};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);

</script>
</body>
