<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	diagramtitle = ""
	dataset = getQueryVariable("data")
	maxYear = getQueryVariable("maxyear")
	minYear = getQueryVariable("minyear")
	if(minYear.length==0){minYear = minDate}else{minYear=parseInt(minYear)}
	if(maxYear.length==0){maxYear = maxDate}else{maxYear=parseInt(maxYear)}
	allText = readTextFile(dataset);
	data_arr = allText.split("\n");
	date = []
	shapes = []
	colors = []
	points = []
	var hoverrowssize = 10
	var labelstmp= []
	var hoverlabelsize = []

	function addLabel(date,str){
		if(labelstmp[date] !=null){
			delim = ","	
			if(hoverlabelsize[date]++ == hoverrowssize){delim=",<br>";hoverlabelsize[date] = 0;};
			labelstmp[date]=(labelstmp[date]+delim+str)
		} else {
			hoverlabelsize[date] = 0;
			labelstmp[date]=str
		}
	}

	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr[i].trim();
		if(line.length>1)
		{	
			tmp = line.split(sep)
			dateA = parseInt(tmp[0])
			dateB = parseInt(tmp[1])
			if(dateB>maxYear){i=data_arr.length}
			if(dateA<minYear){continue;}
			if(dateA==dateB){continue;}
			addLabel(dateA,tmp[2])
			if(dateA == dateB){dateB=parseInt(dateB)+0.5}
			arr = {ysizemode:"scaled",layer:"below","type": 'rect', "xref": 'x',"yref": 'y',"x0": dateA,"y0": i,  "x1": dateB,  "y1": i+0.9,"fillcolor": "black","opacity": 0.6,line:{width:0}}
			shapes.push(arr)
		}
	}

	data = []
	labels =[]
	count=[]

	for (var key in date) {
		data.push(key)
		labels.push(labelstmp[key].substr(0,500))
		count.push(date[key])
		colors.push(stringToColour(labelstmp[key].replaceAll("⇒","").trim()))
	}

	var data = [{
		x: data,
		y: count,
		hovertext:labels,
		hovermode:"closest",
		mode: 'markers',
		marker:{
				color:"white",
				opacity:0.0,
				size:1,
				line:{
					width:0
				}
			},
	}];

	var layout = {
		xaxis: 	{
			automargin: true,
			range:[minDate-2,maxDate+2],
			linewidth: 1,
			title: {
				font: diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
		},
		yaxis: {
			title: {
				font: diagramfont
			},
		},
		annotations: watermarke(),
		shapes: shapes
		};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);

	var myPlot = document.getElementById('myDiv')
	myPlot.on('plotly_click', function(data)
	{
		alert(data.points[0].x+":\n"+data.points[0].hovertext.replaceAll("<br>","").trim());
		//var point = data.y;
		//x=data.points[0].x
	//	parent.document.getElementById('currentDate').value =x
	})

	myPlot.on("plotly_selected", function(eventData) {
		von = (" "+eventData.range.x[0]).split(".")[0].trim()
		bis = (" "+eventData.range.x[1]).split(".")[0].trim()
		parent.document.getElementById("network").src = "network.html?data="+dataset+"&von="+von+"&bis="+bis
	});

</script>
</body>
</html>
