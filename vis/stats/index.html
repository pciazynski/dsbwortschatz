</div>

	<button class = "iframebutton" onclick="embedding('tokenlength');"><script>document.write(lang_htmlembedding)</script></button>
	<button class = "iframebutton" onclick="diagrammlink('tokenlength');"><script>document.write(lang_fullscreen)</script></button>
	<button class = "iframebutton" onclick="datalink('tokenlength');"><script>document.write(lang_rawdata)</script></button>

	<div style="text-align:center;">
		<iframe class="resized" width="100%" height="475px" id="tokenlength" scrolling="yes"></iframe>
	</div>
	<button class = "iframebutton" onclick="diatype('tokenlength','barchart');">Bar</button>

	<p>
		Verteilung von Wortlängen
	</p>
</div>

	<button class = "iframebutton" onclick="embedding('charactercount');"><script>document.write(lang_htmlembedding)</script></button>

		<iframe class="resized"  width="100%" height="475px" id="stats" scrolling="yes"></iframe>
	</div>
</div>

<script>

	var diatype = function(id, diatype){
		loading(id)
		srctmp = document.getElementById(id).src = diatype+".html"+document.getElementById(id).src.split(".html")[1]
	}
	
	loading('tokenlength')
	loading('charactercount')
	
	document.getElementById('stats').src="../../data/stats.txt"
	document.getElementById('tokenlength').src = 'barchart.html?data=stats/characters'
	document.getElementById('charactercount').src = 'barchart.html?data=stats/tokenlength'
	document.title="TokenStats"

</script>
