<!DOCTYPE html>
<meta charset="utf-8">
<head>
</head>
<body style="background-color:white">

<script>
	var miningURL = window.location.protocol+'://'+window.location.hostname+"/"+window.location.pathname.split("/")[1]
	var ctsurl = "https://urncts.eu/cts/dsb/"
	function getQueryVariable(variable) {
		var query = window.location.search.substring(1);
		var vars = query.split("&");
		for (var i=0;i<vars.length;i++) {
			var pair = vars[i].split("=");
			if (pair[0] == variable) {
				return decodeURIComponent(pair[1]);
			}
		} 
		return ""
	}
	
	function readPHP(file){
	text=""
	rawFile = new XMLHttpRequest();
	rawFile.open("GET", miningURL+"/php/"+file, false);
	//alert(miningURL+"php/"+file)
	rawFile.onreadystatechange = function (){
		if(rawFile.readyState === 4){
			if(rawFile.status === 200 || rawFile.status == 0){
				text = rawFile.responseText;
			}
		}
	}
	rawFile.send(null);
	return text.trim()
}

	lemma = getQueryVariable('lemma')
	clickable = getQueryVariable('clickable')
	if(lemma.length>0){
		today = new Date();
		dd = String(today.getDate()).padStart(2, '0');
		mm = String(today.getMonth() + 1).padStart(2, '0'); //January is 0!
		yyyy = today.getFullYear();
		today = dd + '.' + mm + '.' + yyyy;
		data = readPHP("lemmaprofile.php?lemma="+lemma).split("\n")
		if(data.length>0){
			if (clickable == 1){
				if(data[2] != null){
					tmparr = data[2].split("\t")
					data[2] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[2] += '<a href="lemmaprofile.html?lemma='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
					data[2] = data[2].trim()
				}
				if(data[3] != null){
					tmparr = data[3].split("\t")
					data[3] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[3] += '<a href="wordprofile.html?word='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
					data[3] = data[3].trim()
				}
				if(data[4] != null){
					tmparr = data[4].split("\t")
					data[4] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[4] += '<a href="wordprofile.html?word='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
					data[4] = data[4].trim()
				}			}
			infotext = '<table align=center style="valign:top;border: 2px solid black;border-collapse: collapse;">'
			
			infotext+='<tr><td>Häufigkeit&nbsp;&&nbsp;Rang</td>'
			if(clickable==1){infotext+='<td> <a target="_blank" href = "'+miningURL+'vis/bwlemma/zipf.html?data=lemmamapping/_lemmabag&lemma='+lemma+'&limit=100">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'data/lemmamapping/_lemmabag.txt">➚</a></td>'}
			infotext+='<td> '+data[0]+'</td></tr>'
			
			infotext+='<tr style="background-color:#F0F3FA;"><td>Erstes&nbsp;&&nbsp;Letztes&nbsp;Auftreten</td>'
			if(clickable==1){infotext+='<td> <a target="_blank" href = "'+miningURL+'vis/bwlemma/timeline.html?data=lemmasumperyear.php&exact=1&focus=0&lemma='+lemma+'">❧</a> <a target="_blank" href = "'+miningURL+'php/lemmasumperyear.php?exact&lemma='+lemma+'">➚</a></td>'}
			infotext+='<td> '+data[1]+'</td></tr>'
			infotext+='<tr><td>Lemma inkl ambig</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/bwlemma/timeline.html?data=lemmasumperyear.php&sort&focus=0&exact=0&lemma='+lemma+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/lemmasumperyear.php?sort&lemma='+lemma+'">➚</a></td>'}
			infotext+='<td> '+data[2]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Wortformen</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/bwlemma/traviz.html?data=lemmatoken.php&sort&focus=0&exact=1&lemma='+lemma+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/lemmatoken.php?sort&focus=0&exact=1&lemma='+lemma+'">➚</a></td>'}
			infotext+='<td> '+data[3]+'</td></tr>'
			infotext+='<tr><td>Wortformen inkl ambig</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/bwlemma/traviz.html?data=lemmatoken.php&sort&focus=0&lemma='+lemma+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/lemmatoken.php?sort&focus=0&lemma='+lemma+'">➚</a></td>'}
			infotext+='<td> '+data[4]+'</td></tr>'
			
			
			infotext=infotext.replaceAll("\t",", ")
			infotext += '<tr><td></td><td></td><td>Quelle: '+miningURL+'. Accessed ' +today+'</td></tr></table>'
		}
		else{
			infotext = "<br>Keine Daten"
		}
		clicktext = '<table align=center style="valign:top;border-collapse: collapse;"><tr>'
		if(clickable==1){clicktext += '<td><a href="?lemma='+lemma+'">Interaktionselemente entfernen</a></td>'}
		else{clicktext += '<td><a href="?lemma='+lemma+'&clickable=1">Interaktionselemente anzeigen</a></td>'}
		clicktext+='</table>'
		
		document.write('<h1 style="text-align:center;">Lemmaprofil '+lemma+'</h1><p style="text-align:center;">Die Vollständigkeit der Daten entspricht dem Bearbeitungsstand des Textkorpus.</p>'+clicktext+infotext)
	}
</script>

<script>
	document.title='Lemmaprofil '+lemma
</script>

</body>
