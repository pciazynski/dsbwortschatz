<!DOCTYPE html>
<meta charset="utf-8">
<head>
</head>
<body style="background-color:white">

<script>
	var miningURL="https://tiepilab.de/dsbtekstmining/"
	var ctsurl = "https://urncts.eu/cts/dsb/"
	function getQueryVariable(variable) {
		var query = window.location.search.substring(1);
		var vars = query.split("&");
		for (var i=0;i<vars.length;i++) {
			var pair = vars[i].split("=");
			if (pair[0] == variable) {
				return decodeURIComponent(pair[1]);
			}
		} 
		return ""
	}
	
	function readPHP(file){
	text=""
	rawFile = new XMLHttpRequest();
	rawFile.open("GET", miningURL+"php/"+file, false);
	rawFile.onreadystatechange = function (){
		if(rawFile.readyState === 4){
			if(rawFile.status === 200 || rawFile.status == 0){
				text = rawFile.responseText;
			}
		}
	}
	rawFile.send(null);
	return text.trim()
}

	wort = getQueryVariable('wort').toLowerCase()
	clickable = getQueryVariable('clickable')
	if(wort.length>0){
		data = readPHP("typeprofile.php?type="+wort).split("\n")
		if(data.length>1){
			infotext = '<table align=center style="valign:top;border: 2px solid black;border-collapse: collapse;">'
			lemma = data[2].substring(1,data[2].length-1)
			frequ = parseInt(data[0].split("\t"))
			infotext+='<tr><td>Häufigkeit&nbsp;&&nbsp;Rang</td><td> <a target="_blank" href = "'+miningURL+'vis/bwtoken/zipf.html?data=bagofwords/_all&type='+wort+'&limit=100">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'data/bagofwords/_all.txt">➚</a></td><td> '+data[0]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Erstes&nbsp;&&nbsp;Letztes&nbsp;Auftreten</td><td> <a target="_blank" href = "'+miningURL+'vis/bwtoken/timeline.html?data=tokencountperyear.php&print&hidewatermark&sort&token='+wort+'">❧</a> <a target="_blank" href = "'+miningURL+'php/tokencountperyear.php?sort&token='+wort+'">➚</a></td><td>'+data[1]+'</td></tr>'
			infotext+='<tr><td>Lemmatisiert exkl ambig</td><td><a target="_blank" href = "'+miningURL+'vis/bwlemma/timeline.html?data=lemmasumperyear.php&sort&focus=0&exact=1&lemma='+lemma+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/lemmasumperyear.php?sort&exact=1&lemma='+lemma+'">➚</a></td><td> '+data[2]+'</td></tr>'
			infotext+='<tr><td>Lemmatisiert inkl ambig</td><td><a target="_blank" href = "'+miningURL+'vis/bwlemma/timeline.html?data=lemmasumperyear.php&sort&focus=0&exact=1&lemma='+lemma+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/lemmasumperyear.php?sort&exact=1&lemma='+lemma+'">➚</a></td><td> '+data[2]+'</td></tr>'
			
			if (clickable == 1){
				if(data[3] != null){
					tmparr = data[3].split("\t")
					data[3] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[3] += '<a href="?token='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
				}
				if(data[6] != null){
					tmparr = data[6].split("\t")
					data[6] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[6] += '<a href="?token='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
				}
				if(data[7] != null){
					tmparr = data[7].split("\t")
					data[7] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[7] += '<a href="?token='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
				}
			}
			
			infotext+='<tr style="background-color:#F0F3FA;"><td>Variation</td><td> <a target="_blank" href = "'+miningURL+'vis/lemmavariation/traviz.html?data=lemmatoken.php&weight&sort&lemma='+lemma+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/lemmatoken.php?weight&sort&lemma='+lemma+'">➚</a></td><td>'+data[3]+'</td></tr>'
			infotext+='<tr><td>Linke&nbsp;Nachbarn(LogDice)</td><td><a target="_blank" href = "'+miningURL+'vis/collocation/tokenwordnet.html?data=collocation.php&right='+wort+'&logdice=0-14&sortBy=logdice&limit=10">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/collocation.php?right='+wort+'&logdice=0-14&sortBy=logdice&limit=10">➚</a></td><td> '+data[6]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Rechte&nbsp;Nachbarn(LogDice)</td><td><a target="_blank" href = "'+miningURL+'vis/collocation/tokenwordnet.html?data=collocation.php&left='+wort+'&logdice=0-14&sortBy=logdice&limit=10">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/collocation.php?left='+wort+'&logdice=0-14&sortBy=logdice&limit=10">➚</a></td><td> '+data[7]+'</td><td></td><td></td></tr>'
			infotext+='<tr><td>Normierte&nbsp;Form</td><td></td><td> '+data[4]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Typ</td><td></td><td> '+data[5]+'</td><td></td><td></td></tr>'
			infotext+='<tr><td>Verwendungen</td><td><a target="_blank" href="'+ctsurl+'plain/textexamples.php?limit=5&deletexml&snippet='+wort+'">➚</a></td><td id = "examplesentece"> </td></tr>'
			infotext=infotext.replaceAll("\t",", ")+'</table>'
		}
		else{
			infotext = "Keine Daten"
		}
		if(clickable==1){clicktext='<a href="?wort='+wort+'">HTML Verlinkung entfernen</a>'}
		else{clicktext = '<a href="?wort='+wort+'&clickable=1">HTML Verlinkung</a>'}
		document.write('<h1 style="text-align:center;">'+wort+'</h1>'+clicktext+infotext)
	}
</script>

<script>
	document.title="Wortprofil "+wort
</script>

</body>
