<!DOCTYPE html>
<meta charset="utf-8">
<head>
</head>
<body style="background-color:white">

<script>
	var miningURL="https://digilab.serbski-institut.de/dsbtekstmining/"
	var ctsurl = "https://urncts.eu/cts/dsb/"
	function getQueryVariable(variable) {
		var query = window.location.search.substring(1);
		var vars = query.split("&");
		for (var i=0;i<vars.length;i++) {
			var pair = vars[i].split("=");
			if (pair[0] == variable) {
				return decodeURIComponent(pair[1]);
			}
		} 
		return ""
	}
	
	function readPHP(file){
	text=""
	rawFile = new XMLHttpRequest();
	rawFile.open("GET", miningURL+"php/"+file, false);
//	alert(miningURL+"php/"+file)
	rawFile.onreadystatechange = function (){
		if(rawFile.readyState === 4){
			if(rawFile.status === 200 || rawFile.status == 0){
				text = rawFile.responseText;
			}
		}
	}
	rawFile.send(null);
	return text.trim()
}

	norm = getQueryVariable('norm')
	clickable = getQueryVariable('clickable')
	if(norm.length>0){
		data = readPHP("normprofile.php?norm="+norm).split("\n")
		if(data.length>0){
			if (clickable == 1){
				if(data[2] != null){
					tmparr = data[2].split("\t")
					data[2] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[2] += '<a href="normprofile.html?norm='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
					data[2] = data[2].trim()
				}
				if(data[3] != null){
					tmparr = data[3].split("\t")
					data[3] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[3] += '<a href="wordprofile.html?word='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
					data[3] = data[3].trim()
				}
				if(data[4] != null){
					tmparr = data[4].split("\t")
					data[4] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[4] += '<a href="wordprofile.html?word='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
					data[4] = data[4].trim()
				}
			}
			infotext = '<table align=center style="valign:top;border: 2px solid black;border-collapse: collapse;">'
			
			infotext+='<tr><td>Häufigkeit&nbsp;&&nbsp;Rang</td>'
			if(clickable==1){infotext+='<td> <a target="_blank" href = "'+miningURL+'vis/bwnorm/zipf.html?data=normmapping/_normbag&norm='+norm+'&limit=100">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'data/normmapping/_normbag.txt">➚</a></td>'}
			infotext+='<td> '+data[0]+'</td></tr>'
			
			infotext+='<tr style="background-color:#F0F3FA;"><td>Erstes&nbsp;&&nbsp;Letztes&nbsp;Auftreten</td>'
			if(clickable==1){infotext+='<td> <a target="_blank" href = "'+miningURL+'vis/bwnorm/timeline.html?data=normsumperyear.php&exact=1&focus=0&norm='+norm+'">❧</a> <a target="_blank" href = "'+miningURL+'php/normsumperyear.php?exact&norm='+norm+'">➚</a></td>'}
			infotext+='<td> '+data[1]+'</td></tr>'
			infotext+='<tr><td>Normierung inkl ambig</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/bwnorm/timeline.html?data=normsumperyear.php&sort&focus=0&exact=0&norm='+norm+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/normsumperyear.php?sort&norm='+norm+'">➚</a></td>'}
			infotext+='<td> '+data[2]+'</td></tr>'
			infotext+='<tr><td>Wortformen</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/bwnorm/traviz.html?data=normtoken.php&sort&focus=0&exact=1&norm='+norm+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/normtoken.php?sort&focus=0&exact=1&norm='+norm+'">➚</a></td>'}
			infotext+='<td> '+data[3]+'</td></tr>'
			infotext+='<tr><td>Wortformen ambig</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/bwnorm/traviz.html?data=normtoken.php&sort&focus=0&norm='+norm+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/normtoken.php?sort&focus=0&norm='+norm+'">➚</a></td>'}
			infotext+='<td> '+data[4]+'</td></tr>'
			
			
			infotext=infotext.replaceAll("\t",", ")+'</table>'
		}
		else{
			infotext = "<br>Keine Daten"
		}
		clicktext = '<table align=center style="valign:top;border-collapse: collapse;"><tr>'
		if(clickable==1){clicktext += '<td><a href="?norm='+norm+'">Interaktionselemente entfernen</a></td>'}
		else{clicktext += '<td><a href="?norm='+norm+'&clickable=1">Interaktionselemente anzeigen</a></td>'}
		clicktext+='</table>'
		
		document.write('<h1 style="text-align:center;">Normierung '+norm+'</h1><p style="text-align:center;">Die Vollständigkeit der Daten entspricht dem Bearbeitungsstand des Textkorpus.</p>'+clicktext+infotext)
	}
</script>

<script>
	document.title='Normierung '+norm
</script>

</body>
