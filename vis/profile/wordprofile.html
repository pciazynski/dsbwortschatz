<!DOCTYPE html>
<meta charset="utf-8">
<head>
</head>
<body style="background-color:white">

<script>
	var miningURL="https://tiepilab.de/dsbtekstmining/"
	var ctsurl = "https://urncts.eu/cts/dsb/"
	function getQueryVariable(variable) {
		var query = window.location.search.substring(1);
		var vars = query.split("&");
		for (var i=0;i<vars.length;i++) {
			var pair = vars[i].split("=");
			if (pair[0] == variable) {
				return decodeURIComponent(pair[1]);
			}
		} 
		return ""
	}
	
	function readPHP(file){
	text=""
	rawFile = new XMLHttpRequest();
	rawFile.open("GET", miningURL+"php/"+file, false);
//	alert(miningURL+"php/"+file)
	rawFile.onreadystatechange = function (){
		if(rawFile.readyState === 4){
			if(rawFile.status === 200 || rawFile.status == 0){
				text = rawFile.responseText;
			}
		}
	}
	rawFile.send(null);
	return text.trim()
}

	wort = getQueryVariable('wort').toLowerCase()
	clickable = getQueryVariable('clickable')
	if(wort.length>0){
		data = readPHP("wordprofile.php?word="+wort).split("\n")
		if(data.length>1){
			infotext = '<table align=center style="valign:top;border: 2px solid black;border-collapse: collapse;">'
			lemma = data[2].split(":")[0]
			frequ = parseInt(data[0].split("\t"))
			
			if (clickable == 1){
				if(data[2] != null){
					tmparr = data[2].split("\t")
					data[2] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[2] += '<a href="lemmaprofile.html?lemma='+token_count[0]+'&clickable=1">'+token_count[0]+'</a>\t'
					}
				}
				if(data[5] != null){
					tmparr = data[5].split("\t")
					data[5] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[5] += '<a href="wordprofile.html?wort='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
				}
				if(data[6] != null){
					tmparr = data[6].split("\t")
					data[6] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[6] += '<a href="wordprofile.html?wort='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
				}
			}
			
			infotext+='<tr><td>Häufigkeit&nbsp;&&nbsp;Rang</td>'
			if(clickable==1){infotext+='<td> <a target="_blank" href = "'+miningURL+'vis/bwtoken/zipf.html?data=bagofwords/_all&type='+wort+'&limit=100">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'data/bagofwords/_all.txt">➚</a></td>'}
			infotext+='<td> '+data[0]+'</td></tr>'

			infotext+='<tr style="background-color:#F0F3FA;"><td>Erstes&nbsp;&&nbsp;Letztes&nbsp;Auftreten</td>'
			if(clickable==1){infotext+='<td> <a target="_blank" href = "'+miningURL+'vis/bwtoken/timeline.html?data=tokencountperyear.php&print&hidewatermark&sort&token='+wort+'">❧</a> <a target="_blank" href = "'+miningURL+'php/tokencountperyear.php?sort&token='+wort+'">➚</a></td>'}
			infotext+='<td>'+data[1]+'</td></tr>'
			
			infotext+='<tr><td>Lemma</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/bwlemma/timeline.html?data=lemmasumperyear.php&sort&focus=0&exact=1&lemma='+lemma+'">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/lemmasumperyear.php?sort&exact=1&lemma='+lemma+'">➚</a></td>'}
			infotext+='<td> '+data[2]+'</td></tr>'
			
			infotext+='<tr><td>Linke&nbsp;Nachbarn(LogDice)</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/collocation/tokenwordnet.html?data=collocation.php&right='+wort+'&logdice=0-14&sortBy=logdice&limit=10">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/collocation.php?right='+wort+'&logdice=0-14&sortBy=logdice&limit=10">➚</a></td>'}
			infotext+='<td> '+data[5]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Rechte&nbsp;Nachbarn(LogDice)</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "'+miningURL+'vis/collocation/tokenwordnet.html?data=collocation.php&left='+wort+'&logdice=0-14&sortBy=logdice&limit=10">❧</a>&nbsp;<a target="_blank" href = "'+miningURL+'php/collocation.php?left='+wort+'&logdice=0-14&sortBy=logdice&limit=10">➚</a></td>'}
			infotext+='<td> '+data[6]+'</td><td></td><td></td></tr>'
			infotext+='<tr><td>Normierte&nbsp;Form</td>'
			if(clickable==1){infotext+='<td></td>'}
			infotext+='<td> '+data[3]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Typ</td>'
			if(clickable==1){infotext+='<td></td>'}
			infotext+='<td> '+data[4]+'</td></tr>'
			if(clickable==1){infotext+='<tr><td>Verwendungen</td><td><a target="_blank" href="'+ctsurl+'plain/textexamples.php?limit=5&deletexml&snippet='+wort+'">➚</a></td><td id = "examplesentece"> </td></tr>'}
			infotext=infotext.replaceAll("\t",", ")+'</table>'
		}
		else{
			infotext = "<br>Keine Daten"
		}
		if(clickable==1){clicktext='<a href="?wort='+wort+'">Interaktionselemente entfernen</a>'}
		else{clicktext = '<a href="?wort='+wort+'&clickable=1">Interaktionselemente anzeigen</a>'}
		document.write('<h1 style="text-align:center;">'+wort+'</h1>'+clicktext+infotext)
	}
</script>

<script>
	document.title="Wortprofil "+wort
</script>

</body>
