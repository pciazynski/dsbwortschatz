<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/config.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../_assets/gui.js"></script>
	<script src="../../_assets/autocomplete.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>
<body style="background-color:lightgray">
<script>document.write(header())</script>

<br><br>
<table class="optionmenu" align="center">
	<tr>
		<td style="text-align:center;"><script>document.write(lang_word)</script></td>
		<td>
			<div class="autocomplete">
				<input style="width:70%" id="wantedtoken" type="text" placeholder="Wort">
				<button onclick = "updateWord()"><script>document.write(lang_enter)</script></button> 
			</div>
			<script>
				autocomplete("wantedtoken", "prefixsearch.php?&cutoff=2&limit=20&token=", "updateWord"); 
			</script>
		</td>
	</tr>
	<tr>
		<td style="text-align:center;"><script>document.write(lang_lemmafy)</script></td>
		<td>
			<div class="autocomplete">
				<input style="width:70%" id="wantedlemma" type="text" placeholder="Lemma">
				<button onclick = "updateLemma()"><script>document.write(lang_enter)</script></button> 
			</div>
			<script>
				autocomplete("wantedlemma", "prefixlemmasearch.php?&cutoff=2&limit=20&lemma=", "updateLemma"); 
			</script>
		</td>
	</tr>
	<tr>
		<td style="text-align:center;"><script>document.write(lang_normify)</script></td>
		<td>
			<div class="autocomplete">
				<input style="width:70%" id="wantednorm" type="text" placeholder="Normierung">
				<button onclick = "updateNorm()"><script>document.write(lang_enter)</script></button> 
			</div>
			<script>
				autocomplete("wantednorm", "prefixnormsearch.php?&cutoff=2&limit=20&norm=", "updateNorm"); 
			</script>
		</td>
	</tr>
	<tr>
		<td style="text-align:center;"><script>document.write(lang_options)</script></td>
		<td>
			<input id="clickableCheckBox" type="checkbox" checked="false" onchange="switchClickable()"><script>document.write(lang_options)</script></input>

		</td>
	</tr>
</table>

<div class = "iframediv">
	<table  align="center" style = "padding:1px;border-spacing: 2px; text-align:center;background-color:lightgray;width:100%;">
		<tr style = "text-align:right;">
			<td style = "width: 100%;">
				<button class = "iframebutton" onclick="embedding('profile');"><script>document.write(lang_htmlembedding)</script></button>
				<button class = "iframebutton" onclick="diagrammlink('profile');"><script>document.write(lang_fullscreen)</script></button>
				<button class = "iframebutton" onclick="datalink('profile');"><script>document.write(lang_rawdata)</script></button>
			</td>
		</tr>
		<tr>
			<td style = "width: 100%;">		
				<iframe class="resized" width="100%" height="475px" id="profile" scrolling="yes"></iframe>
			</td>
		</tr>
	</table>
</div>

<br><br>
<hr>
<br><br>

<script>


	var switchClickable = function(){
		loading('profile')
		tmp = document.getElementById('profile').src
		if(tmp.includes("&clickable=1")){tmp=tmp.replace("&clickable=1","")}else{tmp=tmp+"&clickable=1"}
		document.getElementById('profile').src=tmp
	}
	
	var updateWord = function(){
		loading('profile')
		tmp = document.getElementById('wantedtoken').value
		if(document.getElementById('clickableCheckBox').checked){tmp+="&clickable=1"}
		document.getElementById('profile').src="wordprofile.html?word="+tmp
	}

	var updateLemma = function(){
		loading('profile')
		tmp = document.getElementById('wantedlemma').value
		if(document.getElementById('clickableCheckBox').checked){tmp+="&clickable=1"}
		document.getElementById('profile').src="lemmaprofile.html?lemma="+tmp
	}
	
	var updateNorm = function(){
		loading('profile')
		tmp = document.getElementById('wantednorm').value
		if(document.getElementById('clickableCheckBox').checked){tmp+="&clickable=1"}
		document.getElementById('profile').src="normprofile.html?norm="+tmp
	}
	tmp = getQueryVariable('word')
	if(tmp.length>0){
		document.getElementById('wantedtoken').value=tmp
		updateWord()
		document.title="Wortprofil "+tmp
	}
	else{
		tmp = getQueryVariable('lemma')
		if(tmp.length>0){
			document.getElementById('wantedlemma').value=tmp
			updateLemma()
			document.title="Lemmaprofil "+tmp
		}else{
			tmp = getQueryVariable('norm')
			if(tmp.length>0){
				document.getElementById('wantednorm').value=tmp
				updateNorm()
				document.title="Normierungsprofil "+tmp
			}
		}
	}

	
</script>

<br><br>
<script>
	document.write(footer())
</script>
</body>
